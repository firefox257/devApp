<style>

<body>
<div class="container">
<h1>SLAM Autogen Test Suite - Phase 2 Keyframe Policy</h1>
<div id="status" class="status waiting">Status: Waiting for initialization...</div>
<button id="btnInit" onclick="initRuntime()">1. Initialize Runtime</button>
<button id="btnRun" onclick="runTests()" disabled>2. Run SLAM & Keypoint Tests</button>
<button id="btnPhase2" class="phase2" onclick="runPhase2Test()" disabled>3. Run Phase 2 Keyframe Policy Test (C++ Synthetic)</button>
<button id="btnPhase2ThreeJS" class="phase2" onclick="runPhase2ThreeJSTest()" disabled>4. Run Phase 2 Keyframe Policy Test (Three.js Camera)</button>
<button id="btnCopy" onclick="copyConsole()" style="background: #333;">Copy Console Log</button>
<div id="visualization-host"></div>
<div id="test-stats">Test statistics will appear here...</div>
<div id="test-scenes-container"></div>
<div id="console"></div>
</div>
<script src="/system/autogen/autogen.js"></script>
<script>
const consoleDiv = document.getElementById('console');
const statusDiv  = document.getElementById('status');
const vizHost = document.getElementById('visualization-host');
const testStatsDiv = document.getElementById('test-stats');
let runtime = null;
let vizScene = null;
let vizCamera = null;
let vizRenderer = null;
let trajectoryLine = null;
let keyframeMarkers = null;
let mapPointsCloud = null;
let floorMesh = null;
let animationFrameId = null;
const originalLog = console.log;
const originalWarn = console.warn;
const originalError = console.error;

function appendToConsole(type, args) {
const div = document.createElement('div');
div.className = `log-${type}`;
const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
consoleDiv.appendChild(div);
consoleDiv.scrollTop = consoleDiv.scrollHeight;
}
console.log = function(...args) { originalLog.apply(console, args); appendToConsole('info', args); };
console.warn = function(...args) { originalWarn.apply(console, args); appendToConsole('warn', args); };
console.error = function(...args) { originalError.apply(console, args); appendToConsole('err', args); };

function setupVisualization() {
vizScene = new THREE.Scene();
vizScene.background = new THREE.Color(0x1a1a1a);
vizCamera = new THREE.PerspectiveCamera(
60,
vizHost.clientWidth / vizHost.clientHeight,
0.1,
1000
);
vizCamera.position.set(0, 5, 10);
vizCamera.lookAt(0, 0, 0);
vizRenderer = new THREE.WebGLRenderer({ antialias: true });
vizRenderer.setSize(vizHost.clientWidth, vizHost.clientHeight);
vizRenderer.setPixelRatio(window.devicePixelRatio);
vizHost.appendChild(vizRenderer.domElement);
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
vizScene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
vizScene.add(dirLight);
const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
vizScene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(5);
vizScene.add(axesHelper);
animateVisualization();
}

function animateVisualization() {
animationFrameId = requestAnimationFrame(animateVisualization);
if (vizRenderer && vizScene && vizCamera) {
vizRenderer.render(vizScene, vizCamera);
}
}

function clearVisualization() {
if (trajectoryLine) {
vizScene.remove(trajectoryLine);
trajectoryLine.geometry.dispose();
trajectoryLine.material.dispose();
trajectoryLine = null;
}
if (keyframeMarkers) {
vizScene.remove(keyframeMarkers);
keyframeMarkers.geometry.dispose();
keyframeMarkers.material.dispose();
keyframeMarkers = null;
}
if (mapPointsCloud) {
vizScene.remove(mapPointsCloud);
mapPointsCloud.geometry.dispose();
mapPointsCloud.material.dispose();
mapPointsCloud = null;
}
if (floorMesh) {
vizScene.remove(floorMesh);
floorMesh.geometry.dispose();
floorMesh.material.dispose();
floorMesh = null;
}
}

async function runPhase2Test() {
const btnPhase2 = document.getElementById('btnPhase2');
btnPhase2.disabled = true;
console.log("\n=== STARTING PHASE 2 KEYFRAME POLICY TEST (C++ Synthetic) ===\n");
try {
clearVisualization();
testStatsDiv.innerHTML = '<span class="stat-label">Running test...</span>';
const result = await runtime.callExport(0, 'run_keyframe_policy_test', 640, 480, 60.0);
if (result !== 0) {
console.error("❌ Phase 2 test failed! Check console for detailed failure reasons.");
testStatsDiv.innerHTML = '<span class="stat-fail">TEST FAILED (Check Console for Details)</span>';
btnPhase2.disabled = false;
return;
}
console.log("\n✅ Phase 2 synthetic test completed successfully!");
testStatsDiv.innerHTML = '<span class="stat-pass">PASS ✅ (See Console for Details)</span>';
} catch (err) {
console.error(`Phase 2 test failed: ${err.message}`);
if (err.stack) console.error(err.stack);
testStatsDiv.innerHTML = `<span class="stat-fail">ERROR: ${err.message}</span>`;
} finally {
btnPhase2.disabled = false;
}
}

async function runPhase2ThreeJSTest() {
const btn = document.getElementById('btnPhase2ThreeJS');
btn.disabled = true;
console.log("\n=== STARTING PHASE 2 KEYFRAME POLICY TEST (Three.js Camera) ===\n");
try {
clearVisualization();
testStatsDiv.innerHTML = '<span class="stat-label">Running Three.js camera simulation...</span>';

const width = 640;
const height = 480;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe0e0e0);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Create a richly textured floor with high-contrast patterns
const floorCanvas = document.createElement('canvas');
floorCanvas.width = 1024; 
floorCanvas.height = 1024;
const floorCtx = floorCanvas.getContext('2d');

// Base checkerboard
floorCtx.fillStyle = '#ffffff';
floorCtx.fillRect(0, 0, 1024, 1024);
floorCtx.fillStyle = '#333333';
for (let y = 0; y < 16; y++) {
for (let x = 0; x < 16; x++) {
if ((x + y) % 2 === 0) {
floorCtx.fillRect(x * 64, y * 64, 64, 64);
}
}
}

// Add distinctive markers at intersections
floorCtx.fillStyle = '#ff0000';
for (let y = 0; y < 16; y += 4) {
for (let x = 0; x < 16; x += 4) {
floorCtx.beginPath();
floorCtx.arc(x * 64 + 32, y * 64 + 32, 8, 0, Math.PI * 2);
floorCtx.fill();
}
}

// Add random noise texture for more features
for (let i = 0; i < 5000; i++) {
const x = Math.random() * 1024;
const y = Math.random() * 1024;
const size = Math.random() * 3 + 1;
floorCtx.fillStyle = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, 0.3)`;
floorCtx.fillRect(x, y, size, size);
}

const floorTex = new THREE.CanvasTexture(floorCanvas);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(2, 2);
const floor = new THREE.Mesh(
new THREE.PlaneGeometry(20, 20), 
new THREE.MeshStandardMaterial({ map: floorTex })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Add multiple distinctive objects at different depths
const objectColors = [0x3498db, 0xe74c3c, 0x2ecc71, 0xf39c12, 0x9b59b6];

// Box 1
const box1 = new THREE.Mesh(
new THREE.BoxGeometry(1.5, 1.5, 1.5), 
new THREE.MeshStandardMaterial({ color: objectColors[0] })
);
box1.position.set(2, 0.75, -3);
scene.add(box1);

// Sphere
const sphere = new THREE.Mesh(
new THREE.SphereGeometry(0.8, 32, 32), 
new THREE.MeshStandardMaterial({ color: objectColors[1] })
);
sphere.position.set(-2, 0.8, -4);
scene.add(sphere);

// Cylinder
const cylinder = new THREE.Mesh(
new THREE.CylinderGeometry(0.6, 0.6, 2, 32), 
new THREE.MeshStandardMaterial({ color: objectColors[2] })
);
cylinder.position.set(0, 1, -5);
scene.add(cylinder);

// Torus
const torus = new THREE.Mesh(
new THREE.TorusGeometry(0.7, 0.3, 16, 32), 
new THREE.MeshStandardMaterial({ color: objectColors[3] })
);
torus.position.set(-3, 1.5, -2);
torus.rotation.x = Math.PI / 4;
scene.add(torus);

// Cone
const cone = new THREE.Mesh(
new THREE.ConeGeometry(0.8, 1.5, 32), 
new THREE.MeshStandardMaterial({ color: objectColors[4] })
);
cone.position.set(3, 0.75, -6);
scene.add(cone);

// Add textured walls for more features
const wallCanvas = document.createElement('canvas');
wallCanvas.width = 512;
wallCanvas.height = 512;
const wallCtx = wallCanvas.getContext('2d');
wallCtx.fillStyle = '#8e44ad';
wallCtx.fillRect(0, 0, 512, 512);

// Add brick pattern
for (let y = 0; y < 16; y++) {
for (let x = 0; x < 8; x++) {
const offsetX = (y % 2) * 32;
wallCtx.strokeStyle = '#555';
wallCtx.lineWidth = 2;
wallCtx.strokeRect(x * 64 + offsetX, y * 32, 64, 32);
}
}

const wallTex = new THREE.CanvasTexture(wallCanvas);
const backWall = new THREE.Mesh(
new THREE.PlaneGeometry(20, 10), 
new THREE.MeshStandardMaterial({ map: wallTex })
);
backWall.position.set(0, 5, -10);
scene.add(backWall);

const testCamera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ width, height, antialias: false, preserveDrawingBuffer: true });
renderer.setSize(width, height);

const offscreenCanvas = document.createElement('canvas');
offscreenCanvas.width = width;
offscreenCanvas.height = height;
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

await runtime.callExport(0, 'slam_reset');
await runtime.callExport(0, 'slam_init', width, height, 60.0);
await runtime.callExport(0, 'slam_set_max_map_points', 2000);
await runtime.callExport(0, 'slam_set_frame_stride', 1);
await runtime.callExport(0, 'slam_set_use_sliding_window', true);
await runtime.callExport(0, 'slam_set_tracking_distance_threshold', 0.15);

const numFrames = 100;
const trajectoryData = [];
let prevKeyframeCount = 0;

const ptrFrame = await runtime.mainWasmInstance.exports.cppmalloc(width * height);
const ptrIMU = await runtime.mainWasmInstance.exports.cppmalloc(3 * 4);
const ptrPose = await runtime.mainWasmInstance.exports.cppmalloc(10 * 4);
const ptrPoseSize = await runtime.mainWasmInstance.exports.cppmalloc(4);

const grayFrame = new Uint8Array(runtime.sharedMemory.buffer, ptrFrame, width * height);
const imuData = new Float32Array(runtime.sharedMemory.buffer, ptrIMU, 3);
imuData.set([0.0, -1.0, 0.0]); 

console.log(`Processing ${numFrames} frames...`);

for (let i = 0; i < numFrames; i++) {
const z = -2.0 - (i * 0.05);
const x = Math.sin(i * 0.1) * 1.5;
const y = 2.0;
testCamera.position.set(x, y, z);
testCamera.lookAt(0, 0, -5);

renderer.render(scene, testCamera);
offscreenCtx.drawImage(renderer.domElement, 0, 0);
const imageData = offscreenCtx.getImageData(0, 0, width, height);
const data = imageData.data;

for (let j = 0, p = 0; j < width * height; j++, p += 4) {
grayFrame[j] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
}

const res = await runtime.callExport(0, 'slam_process_frame', ptrFrame, ptrIMU, ptrPose, ptrPoseSize);
const currentKfCount = await runtime.callExport(0, 'slam_get_keyframe_count');
const currentMapCount = await runtime.callExport(0, 'slam_get_map_point_count');
const isKeyframe = currentKfCount > prevKeyframeCount;

trajectoryData.push({ frame: i, x, y, z, isKeyframe, kfCount: currentKfCount, mapCount: currentMapCount });

if (isKeyframe) {
console.log(`Frame ${i}: Keyframe created (Total KF: ${currentKfCount}, Map Points: ${currentMapCount})`);
prevKeyframeCount = currentKfCount;
}

if (i % 10 === 0) {
await new Promise(r => setTimeout(r, 0));
}
}

const finalKfCount = await runtime.callExport(0, 'slam_get_keyframe_count');
const finalMapCount = await runtime.callExport(0, 'slam_get_map_point_count');
console.log(`\nTest Complete. Final Keyframes: ${finalKfCount}, Map Points: ${finalMapCount}`);

let policyCompliant = true;
const expectedMaxKeyframes = Math.floor(numFrames / 20) + 1; 
if (finalKfCount > expectedMaxKeyframes + 1) {
policyCompliant = false;
console.warn(`Policy Violation: Created ${finalKfCount} keyframes, expected <= ${expectedMaxKeyframes}`);
}
if (finalKfCount < 3) {
policyCompliant = false;
console.warn(`Policy Violation: Created only ${finalKfCount} keyframes, expected at least 3 for this motion`);
}

visualizeThreeJSTrajectory(trajectoryData);

console.log("\n=== FLOOR PLANE VALIDATION ===");

const ptrPlane = await runtime.mainWasmInstance.exports.cppmalloc(4 * 4);
const ptrHullSize = await runtime.mainWasmInstance.exports.cppmalloc(4);
const ptrHull = await runtime.mainWasmInstance.exports.cppmalloc(512 * 3 * 4);

await runtime.callExport(0, 'slam_get_floor_plane', ptrIMU, ptrPlane, ptrHullSize, ptrHull);
const plane = new Float32Array(runtime.sharedMemory.buffer, ptrPlane, 4);
const hullSize = new Int32Array(runtime.sharedMemory.buffer, ptrHullSize, 1)[0];

console.log(`Floor Plane Normal: (${plane[0].toFixed(4)}, ${plane[1].toFixed(4)}, ${plane[2].toFixed(4)})`);
console.log(`Floor Plane Distance (d): ${plane[3].toFixed(4)}`);
console.log(`Floor Hull Vertices: ${hullSize}`);

let floorPassed = false;
if (hullSize >= 3) {
const hull = new Float32Array(runtime.sharedMemory.buffer, ptrHull, hullSize * 3);
visualizeFloorPlane(plane, hull, hullSize);

const normal = new THREE.Vector3(plane[0], plane[1], plane[2]).normalize();
const expectedUp = new THREE.Vector3(0, 1, 0);
const dotProd = Math.abs(normal.dot(expectedUp));
const angleError = Math.acos(Math.min(1.0, dotProd)) * 180.0 / Math.PI;
const distError = Math.abs(plane[3]);

console.log(`\n--- Floor Validation Metrics ---`);
console.log(`Angle Error: ${angleError.toFixed(2)}° (Limit: < 15.0°)`);
console.log(`Distance Error: ${distError.toFixed(4)} (Limit: < 5.0)`);
console.log(`Hull Size: ${hullSize} (Minimum: 3)`);

const angleOk = angleError < 15.0;
const distOk = distError < 5.0;
const hullOk = hullSize >= 3;

console.log(`\n--- Floor Validation Checks ---`);
console.log(`Angle OK: ${angleOk ? '✅ YES' : '❌ NO'}`);
console.log(`Distance OK: ${distOk ? '✅ YES' : '❌ NO'}`);
console.log(`Hull Size OK: ${hullOk ? '✅ YES' : '❌ NO'}`);

if (angleOk && distOk && hullOk) {
floorPassed = true;
console.log(`\n✅ FLOOR VALIDATION: PASS`);
} else {
console.log(`\n❌ FLOOR VALIDATION: FAIL`);
if (!angleOk) console.log(`   → Angle error exceeded 15.0 degrees`);
if (!distOk) console.log(`   → Distance error exceeded 5.0`);
if (!hullOk) console.log(`   → Hull size < 3 (not enough floor points)`);
}
} else {
console.log(`\n❌ FLOOR VALIDATION: FAIL (Insufficient hull vertices: ${hullSize} < 3)`);
}

runtime.mainWasmInstance.exports.cppfree(ptrPlane);
runtime.mainWasmInstance.exports.cppfree(ptrHullSize);
runtime.mainWasmInstance.exports.cppfree(ptrHull);
runtime.mainWasmInstance.exports.cppfree(ptrFrame);
runtime.mainWasmInstance.exports.cppfree(ptrIMU);
runtime.mainWasmInstance.exports.cppfree(ptrPose);
runtime.mainWasmInstance.exports.cppfree(ptrPoseSize);

testStatsDiv.innerHTML = `
<span class="stat-label">Total Frames Processed:</span> <span class="stat-value">${numFrames}</span><br>
<span class="stat-label">Keyframes Created:</span> <span class="stat-value">${finalKfCount}</span><br>
<span class="stat-label">Expected Max Keyframes:</span> <span class="stat-value">${expectedMaxKeyframes}</span><br>
<span class="stat-label">Map Points:</span> <span class="stat-value">${finalMapCount}</span><br>
<span class="stat-label">Floor Hull Vertices:</span> <span class="stat-value">${hullSize}</span><br>
<span class="stat-label">Policy Compliance:</span> <span class="${policyCompliant ? 'stat-pass' : 'stat-fail'}">${policyCompliant ? 'OK ✅' : 'VIOLATION ❌'}</span><br>
<span class="stat-label">Floor Validation:</span> <span class="${floorPassed ? 'stat-pass' : 'stat-fail'}">${floorPassed ? 'PASS ✅' : 'FAIL ❌'}</span>
`;

console.log(`\n=== TEST SUMMARY ===`);
console.log(`Policy Compliance: ${policyCompliant ? '✅ PASS' : '❌ FAIL'}`);
console.log(`Floor Validation: ${floorPassed ? '✅ PASS' : '❌ FAIL'}`);
console.log(`\n✅ Phase 2 Three.js Keyframe Policy Test completed!`);

} catch (err) {
console.error(`Phase 2 Three.js test failed: ${err.message}`);
if (err.stack) console.error(err.stack);
testStatsDiv.innerHTML = `<span class="stat-fail">ERROR: ${err.message}</span>`;
} finally {
btn.disabled = false;
}
}

function visualizeThreeJSTrajectory(data) {
const positions = [];
const colors = [];
for (const pt of data) {
positions.push(pt.x, pt.y, pt.z);
if (pt.isKeyframe) {
colors.push(1.0, 0.0, 0.0); 
} else {
colors.push(0.0, 1.0, 0.0); 
}
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
const material = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 });
trajectoryLine = new THREE.Line(geometry, material);
vizScene.add(trajectoryLine);

const bbox = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
const center = bbox.getCenter(new THREE.Vector3());
const size = bbox.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z, 2);
vizCamera.position.set(center.x, center.y + maxDim * 1.5, center.z + maxDim * 2);
vizCamera.lookAt(center);
}

function renderFrames(scene, width, height) {
const camera1 = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera1.position.set(0, 3, 6);
camera1.lookAt(0, 1, 0);
const renderer = new THREE.WebGLRenderer({ width, height, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(width, height);
const renderAndExtract = (camera) => {
renderer.render(scene, camera);
const tempCanvas = document.createElement('canvas');
tempCanvas.width = width; tempCanvas.height = height;
const ctx = tempCanvas.getContext('2d');
ctx.drawImage(renderer.domElement, 0, 0);
const imageData = ctx.getImageData(0, 0, width, height);
const gray = new Uint8Array(width * height);
for (let i = 0; i < width * height; i++) {
gray[i] = Math.round(0.299 * imageData.data[i * 4] + 0.587 * imageData.data[i * 4 + 1] + 0.114 * imageData.data[i * 4 + 2]);
}
return { gray, canvas: tempCanvas };
};
const r1 = renderAndExtract(camera1);
const camera2 = camera1.clone();
camera2.position.x += 1.2;
camera2.position.y -= 0.3;
camera2.lookAt(0, 1, 0);
const r2 = renderAndExtract(camera2);
renderer.dispose();
return { gray1: r1.gray, gray2: r2.gray, canvas1: r1.canvas, canvas2: r2.canvas, width, height };
}

function generateSceneA() {
const width = 640, height = 480;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe0e0e0);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(5, 10, 7); scene.add(dirLight);
const canvasTex = document.createElement('canvas');
canvasTex.width = 512; canvasTex.height = 512;
const ctx = canvasTex.getContext('2d');
ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 512);
ctx.fillStyle = '#cccccc';
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2 === 0) ctx.fillRect(x * 64, y * 64, 64, 64);
const floorTex = new THREE.CanvasTexture(canvasTex);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 4);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x3498db }));
box.position.y = 1; scene.add(box);
const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
sphere.position.y = 2.8; scene.add(sphere);
return renderFrames(scene, width, height);
}

function generateSceneB() {
const width = 640, height = 480;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd0d0d0);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(-5, 5, 5); scene.add(dirLight);
const wallCanvas = document.createElement('canvas');
wallCanvas.width = 512; wallCanvas.height = 512;
const wCtx = wallCanvas.getContext('2d');
wCtx.fillStyle = '#8e44ad'; wCtx.fillRect(0, 0, 512, 512);
for(let i=0; i<50; i++) {
wCtx.fillStyle = `hsl(${Math.random()*360}, 50%, 50%)`;
wCtx.fillRect(Math.random()*512, Math.random()*512, 30, 30);
}
const wallTex = new THREE.CanvasTexture(wallCanvas);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(15, 10), new THREE.MeshStandardMaterial({ map: wallTex }));
wall.position.z = -5; wall.position.y = 2; scene.add(wall);
const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 3, 32), new THREE.MeshStandardMaterial({ color: 0xf1c40f }));
cyl.position.set(-2, 1.5, 0); scene.add(cyl);
const torus = new THREE.Mesh(new THREE.TorusGeometry(1, 0.4, 16, 32), new THREE.MeshStandardMaterial({ color: 0x2ecc71 }));
torus.position.set(2, 2, 0); torus.rotation.x = Math.PI / 4; scene.add(torus);
return renderFrames(scene, width, height);
}

function generateSceneC() {
const width = 640, height = 480;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbdc3c7);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0, 10, 5); scene.add(dirLight);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x95a5a6 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const bWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshStandardMaterial({ color: 0xecf0f1 }));
bWall.position.set(0, 5, -10); scene.add(bWall);
for(let i=0; i<5; i++) {
const h = 1 + Math.random() * 2;
const box = new THREE.Mesh(new THREE.BoxGeometry(1.5, h, 1.5), new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
box.position.set(-4 + i * 2, h / 2, -2); scene.add(box);
}
return renderFrames(scene, width, height);
}

function createKeypointOverlay(imageCanvas, keypoints, width, height) {
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, width, height, 0, -1, 1);
const texture = new THREE.CanvasTexture(imageCanvas);
texture.minFilter = THREE.LinearFilter;
const planeGeo = new THREE.PlaneGeometry(width, height);
const planeMat = new THREE.MeshBasicMaterial({ map: texture });
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.position.set(width / 2, height / 2, 0);
scene.add(plane);
if (keypoints.length > 0) {
const positions = new Float32Array(keypoints.length * 3);
for (let i = 0; i < keypoints.length; i++) {
positions[i * 3] = keypoints[i].x;
positions[i * 3 + 1] = height - keypoints[i].y;
positions[i * 3 + 2] = 0.1;
}
const pointsGeo = new THREE.BufferGeometry();
pointsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const pointsMat = new THREE.PointsMaterial({
color: 0x00ff00,
size: 6,
sizeAttenuation: false
});
const points = new THREE.Points(pointsGeo, pointsMat);
scene.add(points);
}
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.render(scene, camera);
return renderer.domElement;
}

async function initRuntime() {
const btnInit = document.getElementById('btnInit');
btnInit.disabled = true;
statusDiv.textContent = "Status: Checking environment...";
statusDiv.className = "status waiting";
if (!crossOriginIsolated) {
statusDiv.className = "status error";
statusDiv.textContent = "Status: FAILED (Missing COOP/COEP Headers)";
console.error("FATAL: crossOriginIsolated is false.");
btnInit.disabled = false; return;
}
if (typeof AutogenRuntime === 'undefined') {
statusDiv.className = "status error";
statusDiv.textContent = "Status: FAILED (Autogen JS not found)";
btnInit.disabled = false; return;
}
try {
console.log("Initializing AutogenRuntime...");
runtime = new AutogenRuntime();
await runtime.initialize('slamOpencvTest.wasm');
setupVisualization();
statusDiv.className = "status ready";
statusDiv.textContent = "Status: READY";
document.getElementById('btnRun').disabled = false;
document.getElementById('btnPhase2').disabled = false;
document.getElementById('btnPhase2ThreeJS').disabled = false;
} catch (err) {
statusDiv.className = "status error";
statusDiv.textContent = `Status: FAILED (${err.message})`;
console.error(`Init failed:`, err);
btnInit.disabled = false;
}
}

async function runTests() {
const btnRun = document.getElementById('btnRun');
btnRun.disabled = true;
console.log("Starting SLAM tests...");
try {
const result = await runtime.callExport(0, 'run_slam_tests');
console.log(result === 0 ? "✅ All native C++ tests passed!" : `❌ Native tests failed: ${result}`);
const scenes = [
{ name: "Scene A: Checkerboard Floor & Objects", generator: generateSceneA },
{ name: "Scene B: Textured Wall & Cylinder", generator: generateSceneB },
{ name: "Scene C: Complex Room Layout", generator: generateSceneC }
];
const container = document.getElementById('test-scenes-container');
container.innerHTML = '';
const ag_malloc = runtime.mainWasmInstance.exports.cppmalloc;
const ag_free = runtime.mainWasmInstance.exports.cppfree;
const extractKps = runtime.mainWasmInstance.exports.extract_keypoints_from_image;
const freeKps = runtime.mainWasmInstance.exports.free_keypoints_buffer;
for (const sceneDef of scenes) {
console.log(`\n--- Testing ${sceneDef.name} ---`);
const sceneDiv = document.createElement('div');
sceneDiv.className = 'scene-test-block';
sceneDiv.innerHTML = `<h3>${sceneDef.name}</h3><div class="image-display"></div>`;
container.appendChild(sceneDiv);
const imageDisplay = sceneDiv.querySelector('.image-display');
const { gray1, gray2, canvas1, canvas2, width, height } = sceneDef.generator();
const ptr1 = ag_malloc(width * height);
const ptr2 = ag_malloc(width * height);
new Uint8Array(runtime.sharedMemory.buffer, ptr1, width * height).set(gray1);
new Uint8Array(runtime.sharedMemory.buffer, ptr2, width * height).set(gray2);
const slamRes = await runtime.callExport(0, 'run_threejs_image_test', ptr1, ptr2, width, height);
console.log(`SLAM Pipeline Result: ${slamRes === 0 ? 'PASS' : 'FAIL'}`);
ag_free(ptr1); ag_free(ptr2);
const processFrame = async (canvas, gray, frameName) => {
const ptr = ag_malloc(width * height);
new Uint8Array(runtime.sharedMemory.buffer, ptr, width * height).set(gray);
const outPtrPtr = ag_malloc(4);
const outCountPtr = ag_malloc(4);
await runtime.callExport(0, 'extract_keypoints_from_image', ptr, width, height, outPtrPtr, outCountPtr);
const mem = new Uint8Array(runtime.sharedMemory.buffer);
const kpsPtr = new Uint32Array(mem.buffer, outPtrPtr, 1)[0];
const kpsCount = new Int32Array(mem.buffer, outCountPtr, 1)[0];
const keypoints = [];
if (kpsCount > 0 && kpsPtr !== 0) {
const kpsData = new Float32Array(mem.buffer, kpsPtr, kpsCount * 2);
for (let i = 0; i < kpsCount; i++) {
keypoints.push({ x: kpsData[i * 2], y: kpsData[i * 2 + 1] });
}
freeKps(kpsPtr);
}
ag_free(ptr); ag_free(outPtrPtr); ag_free(outCountPtr);
const overlayCanvas = createKeypointOverlay(canvas, keypoints, width, height);
const frameDiv = document.createElement('div');
frameDiv.className = 'image-container';
frameDiv.innerHTML = `<p>${frameName} (<span style="color:#00ff00">${keypoints.length} Keypoints</span>)</p>`;
frameDiv.appendChild(overlayCanvas);
imageDisplay.appendChild(frameDiv);
};
await processFrame(canvas1, gray1, "Frame 1 (Initial)");
await processFrame(canvas2, gray2, "Frame 2 (Parallax)");
}
} catch (err) {
console.error(`Test execution failed: ${err.message}`);
if(err.stack) console.error(err.stack);
} finally {
btnRun.disabled = false;
}
}

function visualizeFloorPlane(plane, hull, hullSize) {
const normal = new THREE.Vector3(plane[0], plane[1], plane[2]).normalize();
const vertices = [];
for (let i = 0; i < hullSize; i++) {
vertices.push(new THREE.Vector3(
hull[i * 3 + 0],
hull[i * 3 + 1],
hull[i * 3 + 2]
));
}
if (vertices.length < 3) return;
const center = new THREE.Vector3();
for (const v of vertices) center.add(v);
center.multiplyScalar(1 / vertices.length);
let u = new THREE.Vector3(1, 0, 0);
if (Math.abs(u.dot(normal)) > 0.9) u.set(0, 0, 1);
u.crossVectors(u, normal).normalize();
const v = new THREE.Vector3().crossVectors(normal, u).normalize();
const contour2D = vertices.map(p => {
const d = p.clone().sub(center);
return new THREE.Vector2(d.dot(u), d.dot(v));
});
let triangles;
try {
triangles = THREE.ShapeUtils.triangulateShape(contour2D, []);
} catch (e) {
triangles = [];
for (let i = 1; i < vertices.length - 1; i++) {
triangles.push([0, i, i + 1]);
}
}
const positions = new Float32Array(vertices.length * 3);
for (let i = 0; i < vertices.length; i++) {
positions[i * 3 + 0] = vertices[i].x;
positions[i * 3 + 1] = vertices[i].y;
positions[i * 3 + 2] = vertices[i].z;
}
const indices = [];
for (const tri of triangles) {
indices.push(tri[0], tri[1], tri[2]);
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setIndex(indices);
geometry.computeVertexNormals();
const material = new THREE.MeshBasicMaterial({
color: 0x00ff66,
transparent: true,
opacity: 0.3,
side: THREE.DoubleSide,
depthWrite: false
});
floorMesh = new THREE.Mesh(geometry, material);
vizScene.add(floorMesh);
}

async function copyConsole() {
try {
await navigator.clipboard.writeText(consoleDiv.innerText);
const btnCopy = document.getElementById('btnCopy');
const originalText = btnCopy.textContent;
btnCopy.textContent = "Copied!";
setTimeout(() => { btnCopy.textContent = originalText; }, 2000);
} catch (err) { console.error(`Failed to copy: ${err.message}`); }
}
