<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WASM Console</title>

<!-- Required for SharedArrayBuffer (WASM pthreads) -->
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background-color: #0d1117;
	color: #c9d1d9;
	font-family: 'Consolas', 'Courier New', monospace;
	font-size: 14px;
	overflow: hidden;
}
#console {
	width: 100%;
	height: 100%;
	padding: 12px;
	box-sizing: border-box;
	overflow-y: auto;
	white-space: pre-wrap;
	word-break: break-all;
}
.log-info { color: #58a6ff; }
.log-warn { color: #d29922; }
.log-error { color: #f85149; }
</style>
</head>
<body>
<div id="console"></div>

<script type="module">
import { WasmRuntime } from '/system/js/wasm-runtime.js';

const consoleEl = document.getElementById('console');

function appendToConsole(msg, type = 'log') {
	const line = document.createElement('div');
	line.className = `log-${type}`;
	const time = new Date().toLocaleTimeString('en-US', { hour12: false });
	const formattedMsg = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
	line.textContent = `[${time}] ${formattedMsg}`;
	consoleEl.appendChild(line);
	consoleEl.scrollTop = consoleEl.scrollHeight;
}

function addToConsole(msg, type = 'log') {
	const line = document.createElement('span');
	line.className = `log-${type}`;
	const time = new Date().toLocaleTimeString('en-US', { hour12: false });
	const formattedMsg = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
	line.textContent = `${formattedMsg}`;
	consoleEl.appendChild(line);
	consoleEl.scrollTop = consoleEl.scrollHeight;
}

// ==========================================
// 1. Intercept native console
// ==========================================
const _origLog = console.log, _origWarn = console.warn, _origError = console.error, _origInfo = console.info;
console.log = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'log'); _origLog.apply(console, args); };
console.info = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'info'); _origInfo.apply(console, args); };
console.warn = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'warn'); _origWarn.apply(console, args); };
console.error = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'error'); _origError.apply(console, args); };

// ==========================================
// 2. Intercept process.stdout / process.stderr (Node.js polyfills)
// ==========================================

const stdoutWrite = function(chunk, encoding, callback) {
	// Convert Buffer/Uint8Array or other types to string
	const msg = typeof chunk === 'string' ? chunk : String(chunk);
	addToConsole(msg, 'log');

};

const stderrWrite = function(chunk, encoding, callback) {
	const msg = typeof chunk === 'string' ? chunk : String(chunk);
	addToConsole(msg, 'error');

};


class WorkerThreads {
	_wasmMod;
	_sharedMemory;

	constructor(wasmMod, sharedMemory) {
		this._wasmMod = wasmMod;
		this._sharedMemory = sharedMemory;
	}


	// Async factory method to handle fetching and compilation asynchronously.
	// @param {string} wasmFile - Path to the WebAssembly binary.
	// @param {number} memorySize - Desired initial memory size in bytes.

	static async create(wasmFile, memorySize = 16 * 1024 * 1024) {
		// 65536 bytes per WebAssembly page
		const WASM_PAGE_SIZE = 65536;
		const initialPages = Math.ceil(memorySize / WASM_PAGE_SIZE);

		// Create Shared Memory (Accessible by Main Thread + All Workers)
		const sharedMemory = new WebAssembly.Memory({
				initial: initialPages,
				maximum: 4096,
				shared: true // 🚨 CRITICAL for parallel tasks
			});

		const response = await fetch(wasmFile);
		if (!response.ok) {
			throw new Error(`Failed to load Wasm module: ${response.status} ${response.statusText}`);
		}

		var wasmBuffer = await response.arrayBuffer();
		var wasmMod = await WebAssembly.compile(wasmBuffer);

		return new WorkerThreads(wasmMod, sharedMemory);
	}


	// Spawns a Web Worker configured with the shared memory and module.
	//@param {string} workerScriptUrl - URL to the worker's JavaScript file.
	//this needs to change
	spawnWorker(workerScriptUrl) {
		const worker = new Worker(workerScriptUrl, { type: 'module' });

		// Pass the compiled module and shared memory to the worker thread
		worker.postMessage({
				type: 'INIT_WASM',
				module: this._wasmMod,
				memory: this._sharedMemory
			});

		return worker;
	}

	get sharedMemory() {
		return this._sharedMemory;
	}

	get wasmModule() {
		return this._wasmMod;
	}
}





// ==========================================
// 3. WASM Execution
// ==========================================
async function runWasm() {
	console.info('Fetching workon.wasm...');
	try {
		//const response = await fetch('./workon.wasm');
		//if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

		//const wasmBuffer = await response.arrayBuffer();
		//const wasmMod = await WebAssembly.compile(wasmBuffer);


		//console.info(`Downloaded ${wasmBuffer.byteLength} bytes.`);
		//console.info('Initializing WasmRuntime...');

		// 2. Create Shared Memory (Accessible by Main Thread + All Workers)
		//const sharedMemory = new WebAssembly.Memory({
		//		initial: 256,  // 16MB
		//		maximum: 4096, // 256MB
		//		shared: true   // 🚨 CRITICAL for parallel tasks
		//	});
		var workerThreads = await WorkerThreads.create('./workon.wasm');

		const runtime = new WasmRuntime({
				memory: workerThreads.sharedMemory,
				// These will now automatically trigger your intercepted console.log/error!
				onStdout: (msg) => console.log(msg),
				onStderr: (msg) => console.error(msg),
				imports: {
					sys:{
						jstry:(num)=>{
							alert(num);
						}
					},
					env: {
						jsCout: (ptr) => {
							const message = runtime.readString(ptr);
							stdoutWrite(message);
						},
						jsSendToWorker: (wpId, ptr)=> {
							//need to do webworker stuff here
							runtime.callExport('callWorker', ptr);
						}



					}
				},
			});

		console.info('Instantiating WebAssembly module...');
		//await runtime.instantiate(wasmBuffer);
		await runtime.instantiate(workerThreads.wasmModule);

		console.info('Executing main()...');
		const exitCode = runtime.run();

		console.info('Calling greet("Alice")...');
		var namePtr = runtime.writeString("Alice");
		const resultPtr = runtime.callExport('greet', namePtr);
		const greeting = runtime.readString(resultPtr);
		console.info(`Result from C++: "${greeting}"`);

		// Note: Add runtime.callExport('free', resultPtr) here if C++ dynamically allocated the return string
		runtime.freeString(namePtr);

		if (exitCode === 0) {
			console.info('🏁 Application finished successfully (Exit Code 0).');
		} else {
			console.warn(`⚠️ Application exited with code: ${exitCode}`);
		}
	} catch (err) {
		// 1. Log to native console (gives you the clickable file/line number in DevTools)
		_origError('❌ FATAL ERROR:', err);

		// 2. Log to your custom UI with explicit stack trace extraction
		const stackTrace = err instanceof Error ? err.stack : String(err);
		appendToConsole(`❌ FATAL ERROR: ${err.message || err}\n\nStack Trace:\n${stackTrace}`, 'error');

		if (err.message && err.message.includes('SharedArrayBuffer')) {
			console.error('🛑 HINT: Ensure server sends COOP and COEP headers.');
		}
	}
}

runWasm();
</script>
</body>
</html>
