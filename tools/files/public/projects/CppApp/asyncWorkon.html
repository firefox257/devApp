<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASM Parallel Console</title>
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <!-- ... (keep your previous styles and console interceptor) ... -->
</head>
<body>
    <div id="controls">
        <button onclick="document.getElementById('console').innerHTML = ''">Clear Console</button>
    </div>
    <div id="console"></div>

    <script type="module">
        // ... (keep your previous console interceptor code) ...

        async function runWasm() {
            console.info('Fetching try1.wasm...');
            try {
                const response = await fetch('./try1.wasm');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                // 1. Fetch & Compile WASM ONCE (Crucial for multiple workers)
                const wasmBuffer = await response.arrayBuffer();
                const wasmModule = await WebAssembly.compile(wasmBuffer);
                console.info(`✅ Downloaded and compiled WebAssembly.Module.`);

                // 2. Create Shared Memory (Accessible by Main Thread + All Workers)
                const sharedMemory = new WebAssembly.Memory({
                    initial: 256,  // 16MB
                    maximum: 4096, // 256MB
                    shared: true   // 🚨 CRITICAL for parallel tasks
                });
                console.info('✅ Created SharedArrayBuffer for parallel tasks.');

                // 3. Initialize Worker
                const worker = new Worker('./system/js/wasm-worker.js', { type: 'module' });
                
                worker.onmessage = (e) => {
                    const { taskId, type, payload } = e.data;
                    if (type === 'stdout') console.log(`[Worker:${taskId}] ${payload}`);
                    else if (type === 'stderr') console.error(`[Worker:${taskId}] ${payload}`);
                    else if (type === 'status') console.info(`[Worker:${taskId} Status] ${payload}`);
                    else if (type === 'exit') {
                        if (payload === 0) console.info(`[Worker:${taskId}] 🏁 Finished successfully.`);
                        else console.warn(`[Worker:${taskId}] ⚠️ Exited with code ${payload}`);
                    }
                    else if (type === 'error') console.error(`[Worker:${taskId} ❌ FATAL] ${payload}`);
                };

                console.info('Delegating execution to Web Worker...');
                
                // 4. Pass the compiled Module and Shared Memory to the worker
                // WebAssembly.Module is structure-cloneable, no need to transfer!
                worker.postMessage({
                    wasmModule: wasmModule,
                    sharedMemory: sharedMemory,
                    taskId: 'T1'
                });

                // You can now easily spawn a second worker sharing the exact same RAM:
                // const worker2 = new Worker('./system/js/wasm-worker.js', { type: 'module' });
                // worker2.postMessage({ wasmModule, sharedMemory, taskId: 'T2' });

            } catch (err) {
                console.error('❌ FATAL ERROR:', err.message || err);
                if (err.message && err.message.includes('SharedArrayBuffer')) {
                    console.error('🛑 HINT: Ensure server sends COOP and COEP headers.');
                }
            }
        }

        runWasm();
    </script>
</body>
</html>
