<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP3 to WAV Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    max-width: 500px;
    width: 100%;
  }
  h1 {
    color: #333;
    margin-bottom: 8px;
    font-size: 1.8rem;
    text-align: center;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 24px;
    font-size: 0.95rem;
    text-align: center;
  }
  .drop-zone {
    border: 2px dashed #c5c5d6;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafe;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #667eea;
    background: #f0f2ff;
  }
  .drop-zone input { display: none; }
  .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
  .drop-zone .label { color: #555; font-size: 0.95rem; }
  .drop-zone .filename {
    color: #667eea;
    font-weight: 600;
    margin-top: 8px;
    word-break: break-all;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    text-align: center;
    display: none;
    line-height: 1.5;
  }
  .status.info { display: block; background: #e8f0fe; color: #1a56db; }
  .status.success { display: block; background: #e6f7ed; color: #137333; }
  .status.error { display: block; background: #fde7ea; color: #c5221f; }
</style>
</head>
<body>
  <div class="container">
    <h1>🎵 MP3 → WAV Converter</h1>
    <p class="subtitle">Convert audio files right in your browser. Nothing is uploaded.</p>

    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,.mp3">
      <div class="icon">📁</div>
      <div class="label">Click or drag & drop an MP3 file here</div>
      <div class="filename" id="fileName"></div>
    </label>

    <button id="convertBtn" disabled>Convert to WAV</button>

    <div class="status" id="status"></div>
  </div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const fileName = document.getElementById('fileName');
  const convertBtn = document.getElementById('convertBtn');
  const status = document.getElementById('status');

  let selectedFile = null;

  function showStatus(msg, type = 'info') {
    status.className = 'status ' + type;
    status.innerHTML = msg;
  }

  function handleFile(file) {
    if (!file) return;
    
    if (file.size > 50 * 1024 * 1024) { 
      showStatus('⚠️ File is too large (>50MB). This may crash your browser.', 'error');
      return;
    }

    if (!/audio\/mpeg|audio\/mp3|\.mp3$/i.test(file.type + file.name)) {
      showStatus('Please select a valid MP3 file.', 'error');
      return;
    }
    
    selectedFile = file;
    fileName.textContent = file.name;
    convertBtn.disabled = false;
    showStatus('File selected. Click "Convert" when ready.', 'info');
  }

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  // Drag & drop
  ['dragenter', 'dragover'].forEach(ev => {
    dropZone.addEventListener(ev, e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(ev => {
    dropZone.addEventListener(ev, e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
  });
  dropZone.addEventListener('drop', e => {
    handleFile(e.dataTransfer.files[0]);
  });

  // Convert
  convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    
    convertBtn.disabled = true;
    convertBtn.textContent = '⏳ Processing...';
    showStatus('Reading file…', 'info');

    try {
      const arrayBuffer = await selectedFile.arrayBuffer();

      showStatus('Decoding MP3…', 'info');
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));

      showStatus('Encoding WAV…', 'info');
      const wavBlob = encodeWAV(audioBuffer);

      const outName = selectedFile.name.replace(/\.mp3$/i, '') + '.wav';

      showStatus(
        `✅ Conversion complete!<br>
         Duration: ${audioBuffer.duration.toFixed(2)}s ·
         ${audioBuffer.numberOfChannels}ch ·
         ${audioBuffer.sampleRate}Hz<br>
         <em>Downloading ${outName}...</em>`,
        'success'
      );

      // AUTOMATICALLY TRIGGER DOWNLOAD (Fixes iOS Safari blob URL issues)
      triggerDownload(wavBlob, outName);

      audioCtx.close();
    } catch (err) {
      console.error(err);
      showStatus('❌ Conversion failed: ' + err.message, 'error');
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = 'Convert to WAV';
    }
  });

  // iOS Safari specific download trigger
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    
    // Programmatically click the link to force the download manager
    a.click();
    
    // Clean up the DOM and memory. 
    // Note: We wait 5 seconds before revoking the URL, because iOS Safari 
    // will cancel the download if the URL is revoked too quickly.
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 5000);
  }

  // WAV encoder
  function encodeWAV(audioBuffer) {
    const numChannels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const bitsPerSample = 16;
    const length = audioBuffer.length;

    const byteRate = sampleRate * numChannels * bitsPerSample / 8;
    const blockAlign = numChannels * bitsPerSample / 8;
    const dataSize = length * blockAlign;
    const bufferSize = 44 + dataSize;

    const buffer = new ArrayBuffer(bufferSize);
    const view = new DataView(buffer);

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeString(view, 8, 'WAVE');

    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitsPerSample, true);

    writeString(view, 36, 'data');
    view.setUint32(40, dataSize, true);

    const channels = [];
    for (let i = 0; i < numChannels; i++) {
      channels.push(audioBuffer.getChannelData(i));
    }

    let offset = 44;
    for (let i = 0; i < length; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        let sample = channels[ch][i];
        sample = Math.max(-1, Math.min(1, sample));
        sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        view.setInt16(offset, sample, true);
        offset += 2;
      }
    }

    // Force generic binary type to prevent iOS from trying to play it
    return new Blob([buffer], { type: 'application/octet-stream' });
  }

  function writeString(view, offset, str) {
    for (let i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }
</script>
</body>
</html>
