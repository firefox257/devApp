<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Parallax Cube</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; top: 10px; left: 0; right: 0; text-align: center;
    color: #ccc; font-family: system-ui, sans-serif; font-size: 13px;
    pointer-events: none; opacity: 0.7;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag to rotate</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: true, premultipliedAlpha: false })
          || canvas.getContext('experimental-webgl');
  if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL not supported</p>'; return; }

  // ---------- Resize ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(canvas.clientWidth  * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Shaders ----------
  const vsSrc = `
    attribute vec3 aPos;
    attribute vec3 aNormal;
    attribute vec3 aTangent;
    attribute vec3 aBitangent;
    attribute vec2 aUV;

    uniform mat4 uModel;
    uniform mat4 uView;
    uniform mat4 uProj;
    uniform mat3 uNormalMat;
    uniform vec3 uCamPos;

    varying vec2 vUV;
    varying vec3 vViewTS;   // view dir in tangent space
    varying vec3 vLightTS;  // light dir in tangent space

    void main() {
      vec3 worldPos = (uModel * vec4(aPos, 1.0)).xyz;
      gl_Position = uProj * uView * vec4(worldPos, 1.0);
      vUV = aUV;

      // Build TBN matrix (world space)
      vec3 N = normalize(uNormalMat * aNormal);
      vec3 T = normalize(uNormalMat * aTangent);
      vec3 B = normalize(uNormalMat * aBitangent);
      mat3 TBN = mat3(T, B, N); // columns

      // Transform view and light into tangent space
      vec3 V = normalize(uCamPos - worldPos);
      vViewTS = TBN * V;

      vec3 L = normalize(vec3(0.6, 0.8, 0.4));
      vLightTS = TBN * L;
    }
  `;

  const fsSrc = `
    precision highp float;
    varying vec2 vUV;
    varying vec3 vViewTS;
    varying vec3 vLightTS;

    uniform sampler2D uColorTex;
    uniform sampler2D uHeightTex;
    uniform float uParallaxScale;

    void main() {
      // Parallax offset (simple offset mapping)
      vec3 V = normalize(vViewTS);
      float h = texture2D(uHeightTex, vUV).r;
      // Offset UV: push toward view direction based on height
      vec2 offset = (uParallaxScale * (h - 0.5)) * V.xy / V.z;
      vec2 uv = vUV - offset;

      // Sample textures at offset UV
      vec4 col = texture2D(uColorTex, uv);
      float h2 = texture2D(uHeightTex, uv).r;

      // Simple normal from height (finite differences)
      float texel = 1.0 / 256.0;
      float hL = texture2D(uHeightTex, uv - vec2(texel, 0.0)).r;
      float hR = texture2D(uHeightTex, uv + vec2(texel, 0.0)).r;
      float hD = texture2D(uHeightTex, uv - vec2(0.0, texel)).r;
      float hU = texture2D(uHeightTex, uv + vec2(0.0, texel)).r;
      vec3 normal = normalize(vec3(hL - hR, hD - hU, 0.05));

      // Lighting in tangent space
      vec3 L = normalize(vLightTS);
      vec3 N = normal;
      float diff = max(dot(N, L), 0.0);
      vec3 ambient = vec3(0.25);
      vec3 lit = col.rgb * (ambient + diff * 0.9);

      // Slight specular
      vec3 R = reflect(-L, N);
      float spec = pow(max(dot(R, normalize(V)), 0.0), 24.0);
      lit += vec3(spec * 0.3);

      gl_FragColor = vec4(lit, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('shader compile failed');
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.bindAttribLocation(prog, 1, 'aNormal');
  gl.bindAttribLocation(prog, 2, 'aTangent');
  gl.bindAttribLocation(prog, 3, 'aBitangent');
  gl.bindAttribLocation(prog, 4, 'aUV');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const uModel       = gl.getUniformLocation(prog, 'uModel');
  const uView        = gl.getUniformLocation(prog, 'uView');
  const uProj        = gl.getUniformLocation(prog, 'uProj');
  const uNormalMat   = gl.getUniformLocation(prog, 'uNormalMat');
  const uCamPos      = gl.getUniformLocation(prog, 'uCamPos');
  const uColorTex    = gl.getUniformLocation(prog, 'uColorTex');
  const uHeightTex   = gl.getUniformLocation(prog, 'uHeightTex');
  const uParallaxScale = gl.getUniformLocation(prog, 'uParallaxScale');

  // ---------- Procedural textures ----------
  function makeTextures(size) {
    const colorCvs  = document.createElement('canvas');
    const heightCvs = document.createElement('canvas');
    colorCvs.width = colorCvs.height = size;
    heightCvs.width = heightCvs.height = size;
    const cctx = colorCvs.getContext('2d');
    const hctx = heightCvs.getContext('2d');

    // Brick pattern
    const brickW = size / 4;
    const brickH = size / 8;
    const mortar = 3;

    // Height map (grayscale)
    hctx.fillStyle = '#404040'; // mortar (low)
    hctx.fillRect(0, 0, size, size);
    // Add some noise to mortar
    const hImg = hctx.getImageData(0, 0, size, size);
    for (let i = 0; i < hImg.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 20;
      hImg.data[i] = hImg.data[i+1] = hImg.data[i+2] = Math.max(0, Math.min(255, hImg.data[i] + n));
    }
    hctx.putImageData(hImg, 0, 0);

    // Bricks (higher)
    for (let y = 0; y < size; y += brickH) {
      const row = Math.floor(y / brickH);
      const offset = (row % 2) * (brickW / 2);
      for (let x = -brickW; x < size; x += brickW) {
        const bx = x + offset;
        const brightness = 180 + Math.floor(Math.random() * 40);
        hctx.fillStyle = `rgb(${brightness},${brightness},${brightness})`;
        hctx.fillRect(bx + mortar, y + mortar, brickW - mortar * 2, brickH - mortar * 2);
      }
    }
    // Noise on bricks
    const hImg2 = hctx.getImageData(0, 0, size, size);
    for (let i = 0; i < hImg2.data.length; i += 4) {
      if (hImg2.data[i] > 100) {
        const n = (Math.random() - 0.5) * 30;
        hImg2.data[i] = hImg2.data[i+1] = hImg2.data[i+2] = Math.max(0, Math.min(255, hImg2.data[i] + n));
      }
    }
    hctx.putImageData(hImg2, 0, 0);

    // Color map
    cctx.fillStyle = '#3a2a22';
    cctx.fillRect(0, 0, size, size);
    for (let y = 0; y < size; y += brickH) {
      const row = Math.floor(y / brickH);
      const offset = (row % 2) * (brickW / 2);
      for (let x = -brickW; x < size; x += brickW) {
        const bx = x + offset;
        const r = 160 + Math.floor(Math.random() * 60);
        const g = 70  + Math.floor(Math.random() * 40);
        const b = 50  + Math.floor(Math.random() * 30);
        cctx.fillStyle = `rgb(${r},${g},${b})`;
        cctx.fillRect(bx + mortar, y + mortar, brickW - mortar * 2, brickH - mortar * 2);
      }
    }
    // Noise on bricks
    const cImg = cctx.getImageData(0, 0, size, size);
    for (let i = 0; i < cImg.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 25;
      cImg.data[i]   = Math.max(0, Math.min(255, cImg.data[i]   + n));
      cImg.data[i+1] = Math.max(0, Math.min(255, cImg.data[i+1] + n));
      cImg.data[i+2] = Math.max(0, Math.min(255, cImg.data[i+2] + n));
    }
    cctx.putImageData(cImg, 0, 0);

    function makeTex(canvasEl) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvasEl);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D);
      return t;
    }
    return { color: makeTex(colorCvs), height: makeTex(heightCvs) };
  }
  const textures = makeTextures(256);

  // ---------- Cube geometry with tangents ----------
  // Each face: 4 vertices, 6 indices. We need normal, tangent, bitangent per vertex.
  function buildCube() {
    // Faces defined by: center, normal, "up", "right"
    const faces = [
      // +X
      { c:[ 1, 0, 0], n:[ 1, 0, 0], up:[0, 1, 0], ri:[0, 0,-1] },
      // -X
      { c:[-1, 0, 0], n:[-1, 0, 0], up:[0, 1, 0], ri:[0, 0, 1] },
      // +Y
      { c:[0, 1, 0], n:[0, 1, 0], up:[0, 0,-1], ri:[1, 0, 0] },
      // -Y
      { c:[0,-1, 0], n:[0,-1, 0], up:[0, 0, 1], ri:[1, 0, 0] },
      // +Z
      { c:[0, 0, 1], n:[0, 0, 1], up:[0, 1, 0], ri:[1, 0, 0] },
      // -Z
      { c:[0, 0,-1], n:[0, 0,-1], up:[0, 1, 0], ri:[-1,0, 0] },
    ];
    const pos = [], nor = [], tan = [], bit = [], uv = [], idx = [];
    let base = 0;
    for (const f of faces) {
      const corners = [
        [-1, -1], [ 1, -1], [ 1,  1], [-1,  1]
      ];
      for (let i = 0; i < 4; i++) {
        const [u, v] = corners[i];
        const p = [
          f.c[0] + f.ri[0]*u + f.up[0]*v,
          f.c[1] + f.ri[1]*u + f.up[1]*v,
          f.c[2] + f.ri[2]*u + f.up[2]*v,
        ];
        pos.push(...p);
        nor.push(...f.n);
        tan.push(...f.ri);
        bit.push(...f.up);
        uv.push((u+1)/2, (v+1)/2);
      }
      idx.push(base, base+1, base+2, base, base+2, base+3);
      base += 4;
    }
    return {
      pos: new Float32Array(pos),
      nor: new Float32Array(nor),
      tan: new Float32Array(tan),
      bit: new Float32Array(bit),
      uv:  new Float32Array(uv),
      idx: new Uint16Array(idx),
    };
  }
  const cube = buildCube();

  function makeBuffer(data, target) {
    const b = gl.createBuffer();
    gl.bindBuffer(target || gl.ARRAY_BUFFER, b);
    gl.bufferData(target || gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return b;
  }
  const bPos = makeBuffer(cube.pos);
  const bNor = makeBuffer(cube.nor);
  const bTan = makeBuffer(cube.tan);
  const bBit = makeBuffer(cube.bit);
  const bUV  = makeBuffer(cube.uv);
  const bIdx = makeBuffer(cube.idx, gl.ELEMENT_ARRAY_BUFFER);

  function bindAttr(buf, loc, size) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }

  // ---------- Math ----------
  function mat4Perspective(fov, aspect, near, far) {
    const f = 1 / Math.tan(fov / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f/aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far+near)*nf, -1,
      0, 0, 2*far*near*nf, 0,
    ]);
  }
  function mat4LookAt(eye, center, up) {
    const [ex,ey,ez] = eye, [cx,cy,cz] = center, [ux,uy,uz] = up;
    let zx=ex-cx, zy=ey-cy, zz=ez-cz;
    let zl = Math.hypot(zx,zy,zz); zx/=zl; zy/=zl; zz/=zl;
    let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
    let xl = Math.hypot(xx,xy,xz); xx/=xl; xy/=xl; xz/=xl;
    let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx*ex+xy*ey+xz*ez),
      -(yx*ex+yy*ey+yz*ez),
      -(zx*ex+zy*ey+zz*ez),
      1
    ]);
  }
  function mat4RotY(a) {
    const c=Math.cos(a), s=Math.sin(a);
    return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);
  }
  function mat4RotX(a) {
    const c=Math.cos(a), s=Math.sin(a);
    return new Float32Array([1,0,0,0, 0,c,s,0, 0,-s,c,0, 0,0,0,1]);
  }
  function mat4Mul(a, b) {
    const r = new Float32Array(16);
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        r[j*4+i] = a[i]*b[j*4] + a[4+i]*b[j*4+1] + a[8+i]*b[j*4+2] + a[12+i]*b[j*4+3];
      }
    }
    return r;
  }
  function mat3NormalFromMat4(m) {
    // upper-left 3x3, then invert-transpose; for rotation matrices it's just the 3x3
    return new Float32Array([
      m[0], m[1], m[2],
      m[4], m[5], m[6],
      m[8], m[9], m[10],
    ]);
  }

  // ---------- Input ----------
  let rotX = -0.4, rotY = 0.6;
  let dragging = false;
  let lastX = 0, lastY = 0;

  function onDown(x, y) { dragging = true; lastX = x; lastY = y; }
  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    rotY += dx * 0.01;
    rotX += dy * 0.01;
    // Clamp X rotation to avoid flipping
    rotX = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, rotX));
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      onDown(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1) {
      onMove(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);

  // ---------- Render ----------
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  const camPos = [0, 0, 3.5];
  const view = mat4LookAt(camPos, [0,0,0], [0,1,0]);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, textures.color);
  gl.uniform1i(uColorTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, textures.height);
  gl.uniform1i(uHeightTex, 1);
  gl.uniform1f(uParallaxScale, 0.04);

  function frame() {
    resize();
    const aspect = canvas.width / canvas.height;
    const proj = mat4Perspective(Math.PI / 4, aspect, 0.1, 100);

    // Auto-rotate slowly when not dragging
    if (!dragging) rotY += 0.003;

    const model = mat4Mul(mat4RotY(rotY), mat4RotX(rotX));
    const nmat = mat3NormalFromMat4(model);

    gl.clearColor(0.07, 0.07, 0.09, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.uniformMatrix4fv(uModel, false, model);
    gl.uniformMatrix4fv(uView, false, view);
    gl.uniformMatrix4fv(uProj, false, proj);
    gl.uniformMatrix3fv(uNormalMat, false, nmat);
    gl.uniform3fv(uCamPos, camPos);

    bindAttr(bPos, 0, 3);
    bindAttr(bNor, 1, 3);
    bindAttr(bTan, 2, 3);
    bindAttr(bBit, 3, 3);
    bindAttr(bUV,  4, 2);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bIdx);
    gl.drawElements(gl.TRIANGLES, cube.idx.length, gl.UNSIGNED_SHORT, 0);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
