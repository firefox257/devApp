<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C++ → WASM (One Shared Memory, Many Workers)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; padding: 12px; max-width: 100vw; overflow-x: hidden; }
h1 { font-size: 1.2rem; margin: 0 0 10px; color: #00d9ff; }
.editor { width: 100%; height: 35vh; background: #0f0f1a; color: #e6e6e6; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; margin-bottom: 10px; resize: vertical; outline: none; }
.editor:focus { border-color: #00d9ff; }
.controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
button { background: #0077ff; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; flex: 1; min-width: 80px; }
button:disabled { background: #555; cursor: not-allowed; }
button.danger { background: #ff4444; }
button.secondary { background: #444; border: 1px solid #666; }
.console { background: #0f0f1a; border: 1px solid #333; border-radius: 8px; padding: 10px; height: 35vh; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.log-entry { margin: 2px 0; padding: 2px 4px; border-left: 3px solid transparent; }
.log-entry.info { border-left-color: #00d9ff; color: #ccc; }
.log-entry.warn { border-left-color: #ffaa00; color: #ffcc66; }
.log-entry.error { border-left-color: #ff4444; color: #ff8888; }
.log-entry.success { border-left-color: #00cc66; color: #88ffbb; }
.log-clang-entry.info { color: #ccc; }
.log-clang-entry.warn { color: #ffcc66; }
.log-clang-entry.error { color: #ff8888; }
.log-clang-entry.success { color: #88ffbb; }
.progress { height: 4px; background: #333; border-radius: 2px; margin: 8px 0; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #00d9ff, #0077ff); width: 0%; transition: width 0.2s; }
.status { font-size: 11px; color: #888; margin: 4px 0; }
.copied { color: #00cc66; font-size: 11px; margin-left: 8px; display: none; }
@media (max-width: 400px) { .console { font-size: 11px; height: 30vh; } .editor { height: 30vh; font-size: 12px; } button { font-size: 13px; padding: 7px 12px; } }
</style>
</head>
<body>
<h1>🔧 C++ → WASM (One Shared Memory, Many Workers)</h1>
<textarea id="editor" class="editor" spellcheck="false"></textarea>
<div class="controls">
<button id="runBtn" onclick="runCompiler()">▶ Run Compilation</button>
<button id="resetAllBtn" class="secondary" onclick="resetCache('all')">🔄 Reset All Cache</button>
<button id="resetMainBtn" class="secondary" onclick="resetCache('main')">🔄 Reset main.cpp</button>
</div>
<div class="controls">
<button id="clearBtn" class="danger" onclick="clearConsole()">🗑 Clear Logs</button>
<button id="copyBtn" onclick="copyConsole()">📋 Copy</button>
<span id="copiedMsg" class="copied">✓ Copied!</span>
</div>
<div class="progress"><div id="progressBar" class="progress-bar"></div></div>
<div id="status" class="status">Ready. Edit code above and tap "Run Compilation".</div>
<div id="console" class="console"></div>

<script type="module">
const consoleEl = document.getElementById('console');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const runBtn = document.getElementById('runBtn');
const copiedMsg = document.getElementById('copiedMsg');
const editorEl = document.getElementById('editor');
const originalConsole = { log: console.log, warn: console.warn, error: console.error, info: console.info };

function addLog(msg, type = 'info') {
	const entry = document.createElement('div');
	entry.className = `log-entry ${type}`;
	const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
	entry.textContent = `[${time}] ${msg}`;
	consoleEl.appendChild(entry);
	consoleEl.scrollTop = consoleEl.scrollHeight;
	if (originalConsole[type]) originalConsole[type](msg);
}

function addClangLog(msg, type = 'info') {
	const entry = document.createElement('span');
	entry.className = `log-clang-entry ${type}`;
	entry.textContent = `${msg}`;
	consoleEl.appendChild(entry);
	consoleEl.scrollTop = consoleEl.scrollHeight;
	if (originalConsole[type]) originalConsole[type](msg);
}

console.log = (...args) => addLog(args.join(' '), 'info');
console.warn = (...args) => addLog(args.join(' '), 'warn');
console.error = (...args) => addLog(args.join(' '), 'error');
console.info = (...args) => addLog(args.join(' '), 'info');

function updateStatus(msg, progress = null) {
	statusEl.textContent = msg;
	if (progress !== null) progressBar.style.width = `${Math.min(100, Math.max(0, progress))}%`;
}

function setButtons(enabled) {
	runBtn.disabled = !enabled;
	document.getElementById('clearBtn').disabled = !enabled;
	document.getElementById('copyBtn').disabled = !enabled;
	document.getElementById('resetAllBtn').disabled = !enabled;
	document.getElementById('resetMainBtn').disabled = !enabled;
}

window.clearConsole = function() { consoleEl.innerHTML = ''; updateStatus('Console cleared.'); progressBar.style.width = '0%'; };
window.copyConsole = async function() {
	try {
		await navigator.clipboard.writeText(consoleEl.textContent);
		copiedMsg.style.display = 'inline';
		setTimeout(() => copiedMsg.style.display = 'none', 1500);
		addLog('📋 Console copied to clipboard', 'success');
	} catch (e) { addLog('❌ Copy failed: ' + e.message, 'error'); }
};

window.resetCache = function(type) {
	if (type === 'all') { worker.postMessage({ action: 'resetCache', paths: null }); addLog('🔄 Sent command to reset ALL cached files.', 'info'); }
	else if (type === 'main') { worker.postMessage({ action: 'resetCache', paths: ['main.cpp'] }); addLog('🔄 Sent command to reset main.cpp cache.', 'info'); }
};

const worker = new Worker('./compiler.worker.js', { type: 'module' });
worker.onmessage = async (e) => {
	const data = e.data;
	if (data.type === 'log') { addClangLog(data.msg, data.level); return; }
	if (data.type === 'status') { updateStatus(data.msg, data.progress); return; }

	if (data.type === 'result') {
		if (data.success) {
			updateStatus('Compiled! Running output...', 80);
			addLog(`✅ Compilation successful`, 'success');
			const wasmBinary = data.files['app.wasm'];
			if (!wasmBinary) { addLog('❌ No output WASM file generated.', 'error'); updateStatus('❌ Failed. No output.', 0); setButtons(true); return; }
			await executeWasm(wasmBinary);
		} else {
			addLog(`❌ Compilation failed: ${data.error}`, 'error');
			updateStatus('❌ Failed. Check logs.', 0);
			setButtons(true);
		}
	}
};

// ==========================================
// ONE SHARED MEMORY, MANY WORKERS
// ==========================================
async function executeWasm(wasmBinary) {
	addLog('🚀 Setting up One Shared Memory for Many Workers...', 'info');

	// 1. Create the ONE SharedArrayBuffer (The C++ Heap)
	const sharedMemory = new WebAssembly.Memory({ 
		initial: 256, 
		maximum: 512, 
		shared: true 
	});

	// 2. Compile the WASM module ONCE on the main thread
	const wasmModule = await WebAssembly.compile(wasmBinary);
	addLog('✅ WASM Module compiled. Starting Runner Worker...', 'success');

	const runnerWorker = new Worker('./runner.worker.js', { type: 'module' });
	
	runnerWorker.onmessage = (e) => {
		const { type, msg, level, exitCode, error, spawnCpp, funcName, argsJson, threadId } = e.data;
		
		// Handle C++ Thread Spawning (Main thread spawns the worker with the shared memory)
		if (type === 'spawn_cpp') {
			addLog(`🌐 Main Thread spawning C++ Worker ${threadId} with SHARED memory...`, 'info');
			
			const cppWorkerCode = `
				self.onmessage = async function(e) {
					const { wasmModule, sharedMemory, funcName, argsJson, threadId } = e.data;
					try {
						const imports = {
							env: { memory: sharedMemory }
						};

						// 🚨 DYNAMIC STUBBER: Scans the WASM module and stubs ANY missing imports
						for (const imp of WebAssembly.Module.imports(wasmModule)) {
							if (!imports[imp.module]) imports[imp.module] = {};
							
							if (imp.kind === 'function') {
								if (!imports[imp.module][imp.name]) {
									imports[imp.module][imp.name] = () => 0; // Dummy function
								}
							} else if (imp.kind === 'memory') {
								imports[imp.module][imp.name] = sharedMemory;
							} else if (imp.kind === 'table') {
								imports[imp.module][imp.name] = new WebAssembly.Table({ initial: 1, element: 'anyfunc' });
							} else if (imp.kind === 'global') {
								imports[imp.module][imp.name] = new WebAssembly.Global({ value: 'i32', mutable: false }, 0);
							}
						}

						// 🚨 FIX: When passing a WebAssembly.Module, instantiate returns the Instance directly!
						const instance = await WebAssembly.instantiate(wasmModule, imports);

						const func = instance.exports[funcName];
						if (!func) throw new Error('Function not exported: ' + funcName);
						
						const args = JSON.parse(argsJson);
						const result = func(...args);
						
						self.postMessage({ type: 'done', threadId, result });
					} catch (err) {
						self.postMessage({ type: 'error', threadId, msg: err.message });
					}
				};
			`;
			const blob = new Blob([cppWorkerCode], { type: 'application/javascript' });
			const cppWorker = new Worker(URL.createObjectURL(blob));
			
			cppWorker.onmessage = (ev) => {
				const { type, threadId, result, msg } = ev.data;
				if (type === 'done') {
					addLog(`✅ C++ Worker ${threadId} finished. Result: ${result}`, 'success');
				}
				if (type === 'error') {
					addLog(`❌ C++ Worker ${threadId} error: ${msg}`, 'error');
				}
			};
			
			// Pass the compiled module and the SHARED memory (Zero-copy transfer)
			cppWorker.postMessage({ 
				wasmModule, 
				sharedMemory, 
				funcName, 
				argsJson, 
				threadId 
			});
			return;
		}
		
		if (type === 'log') { addClangLog(msg, level); return; }
		if (type === 'done') {
			if (exitCode === 0) addLog('✅ Main application finished successfully', 'success');
			else addLog(`⚠️ Application exited with code: ${exitCode}`, 'warn');
			updateStatus('✓ All done!', 100);
			runnerWorker.terminate();
			setButtons(true);
			return;
		}
		if (type === 'error') {
			addLog(`❌ WASM Execution Error: ${error}`, 'error');
			updateStatus('❌ Execution failed.', 0);
			runnerWorker.terminate();
			setButtons(true);
		}
	};
	
	// Pass the compiled module and the SHARED memory to the runner
	runnerWorker.postMessage({ wasmModule, sharedMemory });
}

// ==========================================
// DEFAULT C++ CODE (Safe for Shared Heap)
// ==========================================
const defaultCode = `#include <iostream>
#include <string>

extern "C" {
    int ww_spawn_cpp(const char* func_name, const char* args_json);
}

// 🚨 FIXED Minimal JSON Serializer
inline std::string to_json(int v) { return std::to_string(v); }
inline std::string to_json(double v) { return std::to_string(v); }
inline std::string to_json(const std::string& v) { return "\\"" + v + "\\""; }
inline std::string to_json(const char* v) { return to_json(std::string(v)); }

// Base case: just append the value
template<typename T> void serialize_args(std::string& j, T a) { 
    j += to_json(a); 
}
// Recursive case: append value, add comma, then recurse
template<typename T, typename... A> void serialize_args(std::string& j, T f, A... r) { 
    j += to_json(f);
    j += ",";
    serialize_args(j, r...); 
}
// -------------------------------

namespace wwthread {
    class thread {
    public:
        template<typename... Args>
        thread(const char* func_name, Args... args) {
            std::string json = "[";
            serialize_args(json, args...);
            json += "]";
            ww_spawn_cpp(func_name, json.c_str());
        }
    };
}

// 🚨 GLOBAL SHARED ARRAY (Lives in the SharedArrayBuffer)
// All workers can read/write to this safely if they don't overlap!
int shared_data[1000];

// 🚨 THIS FUNCTION RUNS IN A SEPARATE WEB WORKER
// It uses the EXACT SAME HEAP as the main thread and other workers.
extern "C" int heavy_calculation(int thread_id, int iterations) {
    // Each thread writes to a different part of the array to avoid data races
    int start = thread_id * 100;
    for (int i = 0; i < 100; i++) {
        shared_data[start + i] = (thread_id * 1000) + i;
    }
    return shared_data[start + 99];
}

int main() {
    std::cout << "=== One Shared Memory, Many Workers ===" << std::endl;
    std::cout << "Spawning 4 C++ threads on the SAME heap..." << std::endl;

    // Spawn 4 workers. They all share the same 'shared_data' array in memory!
    wwthread::thread t1("heavy_calculation", 0, 1000);
    wwthread::thread t2("heavy_calculation", 1, 1000);
    wwthread::thread t3("heavy_calculation", 2, 1000);
    wwthread::thread t4("heavy_calculation", 3, 1000);

    std::cout << "Main: All workers spawned. They are running concurrently on the shared heap." << std::endl;
    
    return 0;
}`.trim();

editorEl.value = defaultCode;

window.runCompiler = function() {
	setButtons(false);
	clearConsole();
	updateStatus('Sending job to Web Worker...', 10);
	addLog('📝 Preparing C++ source...', 'info');

	worker.postMessage({
			id: Date.now(),
			sourcePath: 'main.cpp',
			sourceCode: editorEl.value,
			args: [
				'clang++',
				'-std=c++17',
				'-O2',
				'-fno-exceptions',
				'-fno-rtti',
				'-matomics',                  // 🚀 Enable WASM atomic instructions
				'-mbulk-memory',              // 🚀 Enable bulk memory operations
				'-Wl,--shared-memory',        // 🚀 Tell linker to flag memory as shared
				'-Wl,--import-memory',        // 🚀 JS will provide the SharedArrayBuffer
				'-Wl,--max-memory=268435456', // 🚀 REQUIRED: Shared memory must have a max limit (256MB)
				'-Wl,--no-check-features',    // 🚀 Bypass single-threaded sysroot error
				'-Wl,--allow-undefined',
				'-Wl,--export-all',
				'-o', 'app.wasm',
				'main.cpp'
			]
		});
};

addLog('👋 Ready to compile C++ → WASM with Shared Memory Workers!', 'success');
addLog('📱 Edit the code above and tap "Run Compilation".', 'info');
addLog('⚠️ Note: SharedArrayBuffer requires COOP/COEP server headers.', 'warn');
</script>
</body>
</html>
