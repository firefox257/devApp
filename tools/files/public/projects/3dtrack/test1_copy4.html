<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>WebGL Multi-Person Body & Hand Tracking</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .security-warning {
      background: #ff4444;
      color: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 640px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 640px;
    }

    select {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      z-index: 1; 
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2; 
      pointer-events: none;
    }

    .status-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.85);
      color: #00FF66;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      border: 1px solid #00FF66;
      transition: color 0.3s, border-color 0.3s;
    }

    .console-wrapper {
      width: 100%;
      max-width: 640px;
      margin-top: 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .console-header {
      padding: 8px 12px;
      background: #2a2a2a;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .console-logs {
      height: 150px;
      overflow-y: auto;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-item { word-break: break-word; white-space: pre-wrap; border-bottom: 1px solid #282828; padding-bottom: 2px; }
    .log-info { color: #8cdcfe; }
    .log-warn { color: #ce9178; }
    .log-error { color: #f48771; }
  </style>

  <!-- 1. TensorFlow.js Core -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <!-- 2. MoveNet for Body Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <!-- 3. MediaPipe Hands Solution (REQUIRED for stable browser hand detection) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
  <!-- 4. Hand Pose Detection Wrapper -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>
</head>
<body>

  <div id="securityWarning" class="security-warning">
    ⚠️ Camera requires HTTPS or localhost. If you opened this file directly (file://), it will not work. Use a local server (e.g., VS Code Live Server).
  </div>

  <div class="controls">
    <select id="cameraSelect">
      <option value="">Loading cameras...</option>
    </select>
    <select id="peopleSelect">
      <option value="1">1 Person</option>
      <option value="2">2 People</option>
      <option value="3">3 People</option>
      <option value="4">4 People</option>
    </select>
  </div>

  <div class="container">
    <div class="status-badge" id="statusBadge">Status: Initializing...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="console-wrapper">
    <div class="console-header">
      <span>WEBGL CONSOLE LOGS</span>
      <div style="display: flex; gap: 15px;">
        <span id="copyLogs" style="font-weight: normal; text-decoration: underline; cursor: pointer;">Copy</span>
        <span id="clearLogs" style="font-weight: normal; text-decoration: underline; cursor: pointer;">Clear</span>
      </div>
    </div>
    <div class="console-logs" id="consoleLogs"></div>
  </div>

  <script>
    console.log("✅ Script started. Checking environment...");

    if (!window.isSecureContext) {
      document.getElementById("securityWarning").style.display = "block";
      console.error("❌ Not a secure context! Camera API requires HTTPS or localhost.");
      updateStatus("Secure Context Required", "error");
    }

    function updateStatus(msg, type = "info") {
      const badge = document.getElementById("statusBadge");
      badge.textContent = `Status: ${msg}`;
      if (type === "error") {
        badge.style.color = "#FF4444";
        badge.style.borderColor = "#FF4444";
      } else if (type === "warn") {
        badge.style.color = "#FFAA00";
        badge.style.borderColor = "#FFAA00";
      } else {
        badge.style.color = "#00FF66";
        badge.style.borderColor = "#00FF66";
      }
    }

    // --- Console Logger ---
    const logsContainer = document.getElementById("consoleLogs");
    function appendLog(type, args) {
      const msg = args.map(a => {
        if (a instanceof Error) return `${a.message}\n${a.stack}`;
        if (typeof a === "object") {
          try { return JSON.stringify(a, Object.getOwnPropertyNames(a)); } 
          catch (e) { return String(a); }
        }
        return String(a);
      }).join(" ");
      
      const el = document.createElement("div");
      el.className = `log-item log-${type}`;
      el.textContent = `[${type.toUpperCase()}] ${msg}`;
      logsContainer.appendChild(el);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    const origLog = console.log, origWarn = console.warn, origErr = console.error;
    console.log = (...a) => { origLog(...a); appendLog("info", a); };
    console.warn = (...a) => { origWarn(...a); appendLog("warn", a); };
    console.error = (...a) => { origErr(...a); appendLog("error", a); };

    document.getElementById("clearLogs").addEventListener("click", (e) => {
      e.stopPropagation();
      logsContainer.innerHTML = "";
    });

    document.getElementById("copyLogs").addEventListener("click", async (e) => {
      e.stopPropagation();
      const logText = logsContainer.innerText;
      if (!logText.trim()) return;
      try {
        await navigator.clipboard.writeText(logText);
        const btn = e.target;
        btn.textContent = "Copied!";
        btn.style.color = "#00FF66";
        setTimeout(() => { btn.textContent = "Copy"; btn.style.color = ""; }, 1500);
      } catch (err) {
        console.error("Clipboard failed:", err);
      }
    });

    // --- Core Engine Variables ---
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const cameraSelect = document.getElementById("cameraSelect");
    const peopleSelect = document.getElementById("peopleSelect");

    let detector = null;
    let handDetector = null;
    let currentStream = null;
    let maxPoses = 1;

    const SKELETON_PAIRS = [
      [5, 6], [5, 7], [7, 9], [6, 8], [8, 10],
      [5, 11], [6, 12], [11, 12],
      [11, 13], [13, 15], [12, 14], [14, 16]
    ];

    const TRAIL_JOINTS = [7, 8, 9, 10, 13, 14, 15, 16]; 
    const MAX_HISTORY = 25;
    let motionTrails = {};
    const HAND_OPEN_THRESHOLD = 1.4;

    async function initDetectors() {
      try {
        updateStatus("Loading TF.js Backend...");
        console.log("Setting backend to WebGL...");
        await tf.setBackend("webgl");
        await tf.ready();
        console.log("✅ TensorFlow.js ready. Active backend:", tf.getBackend());

        if (detector) detector.dispose();
        if (handDetector) handDetector.dispose();

        // 1. Initialize MoveNet
        updateStatus("Loading MoveNet...");
        const modelType = maxPoses > 1 
          ? poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING 
          : poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING;

        console.log("Loading MoveNet model:", modelType);
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { 
            modelType: modelType,
            enableTracking: true,
            enableSmoothing: true,
            maxPoses: maxPoses,
            trackerType: poseDetection.TrackerType.BoundingBox
          }
        );
        console.log("✅ MoveNet loaded.");

        // 2. Initialize MediaPipe Hands (Using 'mediapipe' runtime for browser stability)
        if (typeof handPoseDetection === 'undefined') {
          throw new Error("handPoseDetection library failed to load. Check your internet connection or ad-blocker.");
        }
        
        updateStatus("Loading Hand Detector...");
        console.log("Loading MediaPipe Hands model (this may take a few seconds)...");
        handDetector = await handPoseDetection.createDetector(
          handPoseDetection.SupportedModels.MediaPipeHands,
          {
            runtime: 'mediapipe', // CRITICAL: 'mediapipe' runtime is vastly more stable in browsers than 'tfjs'
            solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
            modelType: 'lite'
          }
        );
        console.log("✅ Hand Detector loaded.");

        motionTrails = {};
        updateStatus("Ready");
        console.log(`✅ All Models Ready (${maxPoses} person mode + Hand Tracking)`);
      } catch (err) {
        updateStatus("Model Load Failed", "error");
        console.error("❌ Init Error:", err);
      }
    }

    // --- Hand State Logic ---
    function evaluateHandState(handKeypoints) {
      const wrist = handKeypoints[0];
      const middleMCP = handKeypoints[9];
      
      const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
      if (handSize < 10) return { state: 'unknown', color: '#888888' };

      const indexTip = handKeypoints[8];
      const middleTip = handKeypoints[12];
      const ringTip = handKeypoints[16];
      const pinkyTip = handKeypoints[20];

      const distIndex = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y);
      const distMiddle = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);
      const distRing = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y);
      const distPinky = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y);

      const avgTipDist = (distIndex + distMiddle + distRing + distPinky) / 4;
      const opennessRatio = avgTipDist / handSize;

      const isClosed = opennessRatio < HAND_OPEN_THRESHOLD;
      
      return {
        state: isClosed ? 'grabbing' : 'open',
        color: isClosed ? '#FF0055' : '#00FF66',
        ratio: opennessRatio.toFixed(2)
      };
    }

    function getHandStateForWrist(moveNetWrist, hands) {
      if (!moveNetWrist || moveNetWrist.score < 0.3) return { state: 'unknown', color: '#888888' };

      let closestHand = null;
      let minDist = Infinity;

      for (const hand of hands) {
        if (hand.score < 0.5) continue;
        const handWrist = hand.keypoints[0];
        const dist = Math.hypot(handWrist.x - moveNetWrist.x, handWrist.y - moveNetWrist.y);
        
        if (dist < minDist && dist < 120) {
          minDist = dist;
          closestHand = hand;
        }
      }

      if (closestHand) {
        return evaluateHandState(closestHand.keypoints);
      }

      return { state: 'not detected', color: '#FFAA00' };
    }

    // --- Camera & Rendering ---
    async function setupCameraOptions() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("navigator.mediaDevices is undefined.");
        }

        console.log("Requesting initial camera permission...");
        const initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
        initialStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === "videoinput");

        cameraSelect.innerHTML = "";
        videoDevices.forEach((device, index) => {
          const opt = document.createElement("option");
          opt.value = device.deviceId;
          opt.textContent = device.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(opt);
        });

        if (videoDevices.length > 0) {
          console.log("Starting camera:", videoDevices[0].label);
          startCamera(videoDevices[0].deviceId);
        } else {
          console.warn("No video devices found.");
          updateStatus("No Camera Found", "warn");
        }
      } catch (err) {
        updateStatus("Camera Error", "error");
        console.error("❌ Camera Error:", err);
      }
    }

    async function startCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
        video.srcObject = currentStream;
        console.log("✅ Camera stream started.");
      } catch (err) {
        updateStatus("Stream Error", "error");
        console.error("❌ Stream Error:", err);
      }
    }

    function drawTrails(personId, keypoints, scaleX, scaleY) {
      if (!motionTrails[personId]) motionTrails[personId] = {};
      const personTrails = motionTrails[personId];

      TRAIL_JOINTS.forEach(jIdx => {
        const kp = keypoints[jIdx];
        if (!kp || (kp.score && kp.score < 0.15)) return;

        if (!personTrails[jIdx]) personTrails[jIdx] = [];
        personTrails[jIdx].push({ x: kp.x * scaleX, y: kp.y * scaleY });

        if (personTrails[jIdx].length > MAX_HISTORY) personTrails[jIdx].shift();

        const pts = personTrails[jIdx];
        if (pts.length < 2) return;

        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (let i = 1; i < pts.length; i++) {
          const alpha = i / pts.length;
          ctx.strokeStyle = `rgba(0, 225, 255, ${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      });
    }

    async function renderLoop() {
      if (!detector || !handDetector || video.readyState < 2) {
        requestAnimationFrame(renderLoop);
        return;
      }

      if (video.videoWidth > 0 && video.videoHeight > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
      }

      let poses = [];
      try {
        poses = await detector.estimatePoses(video, {
          maxPoses: maxPoses,
          flipHorizontal: false
        });
      } catch (e) {
        console.error("Pose estimation failed:", e);
        poses = [];
      }

      if (!Array.isArray(poses)) poses = [];

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const activePoses = poses.filter(p => (p.score === undefined || p.score > 0.15)).slice(0, maxPoses);
      updateStatus(`Tracking: ${activePoses.length} person(s)`);

      const scaleX = canvas.width / video.videoWidth;
      const scaleY = canvas.height / video.videoHeight;
      const activeIds = new Set();

      const wristsVisible = activePoses.some(p => 
        (p.keypoints[9]?.score > 0.3) || (p.keypoints[10]?.score > 0.3)
      );

      let hands = [];
      if (wristsVisible) {
        try {
          hands = await handDetector.estimateHands(video);
        } catch (e) {
          console.warn("Hand detection skipped this frame:", e);
        }
      }

      activePoses.forEach((pose, index) => {
        const personId = pose.id !== undefined ? pose.id : index;
        activeIds.add(personId);

        drawTrails(personId, pose.keypoints, scaleX, scaleY);

        ctx.shadowColor = "#00FF66";
        ctx.shadowBlur = 8;
        ctx.strokeStyle = "#00FF66";
        ctx.lineWidth = 5;

        SKELETON_PAIRS.forEach(([i, j]) => {
          const kp1 = pose.keypoints[i];
          const kp2 = pose.keypoints[j];
          const score1 = kp1 ? (kp1.score ?? 1) : 0;
          const score2 = kp2 ? (kp2.score ?? 1) : 0;

          if (score1 > 0.15 && score2 > 0.15) {
            ctx.beginPath();
            ctx.moveTo(kp1.x * scaleX, kp1.y * scaleY);
            ctx.lineTo(kp2.x * scaleX, kp2.y * scaleY);
            ctx.stroke();
          }
        });

        pose.keypoints.forEach((kp, kpIndex) => {
          const score = kp ? (kp.score ?? 1) : 0;
          if (score > 0.15) {
            let pointColor = "#FF0055";
            let radius = 6;

            if (kpIndex === 9 || kpIndex === 10) {
              const handState = getHandStateForWrist(kp, hands);
              pointColor = handState.color;
              radius = 9;

              if (handState.state !== 'unknown' && handState.state !== 'not detected') {
                ctx.shadowBlur = 0;
                ctx.fillStyle = pointColor;
                ctx.font = "bold 12px monospace";
                ctx.fillText(
                  handState.state === 'grabbing' ? "✊ GRAB" : "🖐 OPEN", 
                  (kp.x * scaleX) + 14, 
                  (kp.y * scaleY) + 4
                );
                ctx.shadowBlur = 10;
              }
            }

            ctx.shadowColor = pointColor;
            ctx.shadowBlur = 10;
            ctx.fillStyle = pointColor;

            ctx.beginPath();
            ctx.arc(kp.x * scaleX, kp.y * scaleY, radius, 0, 2 * Math.PI);
            ctx.fill();
          }
        });

        ctx.shadowBlur = 0;
      });

      for (const id in motionTrails) {
        if (!activeIds.has(Number(id))) {
          delete motionTrails[id];
        }
      }

      requestAnimationFrame(renderLoop);
    }

    cameraSelect.addEventListener("change", e => startCamera(e.target.value));
    peopleSelect.addEventListener("change", async e => {
      maxPoses = parseInt(e.target.value, 10);
      updateStatus("Reinitializing Models...");
      await initDetectors();
    });

    (async () => {
      await initDetectors();
      await setupCameraOptions();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
