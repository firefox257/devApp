<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>AI Code Formatter Tool</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: #1a1a1a; color: #e0e0e0; padding: 20px; line-height: 1.6;
			}
			.container { max-width: 1000px; margin: 0 auto; }
			h1 { color: #4a9eff; margin-bottom: 20px; }
			.section { background: #2a2a2a; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
			h2 { margin-bottom: 15px; color: #ccc; font-size: 18px; }
			.file-list { margin-top: 15px; }
			.file-item {
				display: flex; align-items: center; padding: 10px; background: #3a3a3a;
				margin-bottom: 5px; border-radius: 4px; transition: background 0.2s;
			}
			.file-item:hover { background: #444; }
			.file-item input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
			.file-item label { cursor: pointer; flex: 1; font-family: monospace; font-size: 15px; }
			.select-all {
				display: flex; align-items: center; padding: 10px; background: #4a9eff;
				color: white; border-radius: 4px; margin-bottom: 10px; font-weight: bold;
			}
			.select-all input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
			textarea {
				width: 100%; min-height: 150px; background: #3a3a3a; color: #e0e0e0;
				border: 1px solid #4a4a4a; border-radius: 4px; padding: 12px;
				font-family: inherit; font-size: 14px; resize: vertical;
			}
			.button-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
			button {
				background: #4a9eff; color: white; border: none; padding: 12px 24px;
				border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s;
			}
			button:hover { background: #3a8eef; }
			button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
			button.secondary { background: #555; }
			button.secondary:hover { background: #666; }
			.copy-btn { background: #28a745; }
			.copy-btn:hover { background: #218838; }
			.output {
				background: #111; border: 1px solid #4a4a4a; border-radius: 4px; padding: 15px;
				font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap;
				word-wrap: break-word; max-height: 600px; overflow-y: auto; color: #d4d4d4;
			}
			.empty-state { text-align: center; padding: 20px; color: #888; }
			.error-badge { color: #ff5555; font-size: 12px; margin-left: 10px; font-weight: bold; }
		</style>
	</head>
	<body>
		<div class="container">
			<h1>🤖 AI Code Formatter Tool</h1>

			<div class="section">
				<h2>Files</h2>
				<div class="file-list">
					<div class="select-all">
						<input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
						<label for="selectAll">Select All Files</label>
					</div>
					<div id="filesContainer">
						<div class="empty-state">Loading files...</div>
					</div>
				</div>
			</div>

			<div class="section">
				<h2>Prompt</h2>
				<textarea id="promptInput" placeholder="Enter your AI prompt here..."></textarea>
			</div>

			<div class="section">
				<div class="button-group">
					<button id="generateBtn" onclick="generateOutput()">⚡ Generate AI Prompt</button>
					<button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display: none;">📋 Copy to Clipboard</button>
					<button class="secondary" id="clearBtn" onclick="clearOutput()" style="display: none;">🗑️ Clear Output</button>
				</div>

				<div id="outputSection" style="display: none;">
					<h2>Generated Output</h2>
					<div class="output" id="output"></div>
				</div>
			</div>
		</div>

		<script>
			// ============================================
			// 1. FILE ARRAY - Edit this for easy access
			// ============================================
			const fileNames = [
				"./tensorindex_worker.html",
				"./tensorindex_worker.js",
				"./training-worker.js",
				
			];
			// ============================================

			let files = [];

			window.addEventListener('DOMContentLoaded', async () => {
					const container = document.getElementById('filesContainer');
					container.innerHTML = '<div class="empty-state">Loading files...</div>';

					for (const name of fileNames) {
						await loadFile(name);
					}
					renderFileList();
				});

			async function loadFile(name) {
				try {
					const response = await fetch(name);
					if (!response.ok) throw new Error(`Status ${response.status}`);
					const content = await response.text();
					files.push({ name, content, selected: true });
				} catch (error) {
					console.error(`Failed to fetch ${name}:`, error);
					files.push({
							name,
							content: `[Error loading file: ${error.message}. Make sure you are running this on a local server like Live Server.]`,
							selected: true,
							error: true
						});
				}
			}

			function renderFileList() {
				const container = document.getElementById('filesContainer');
				if (files.length === 0) {
					container.innerHTML = '<div class="empty-state">No files found.</div>';
					return;
				}

				container.innerHTML = files.map((file, index) => {
						const errorBadge = file.error ? '<span class="error-badge">(Load Error)</span>' : '';
						return `
						<div class="file-item">
						<input type="checkbox" id="file-${index}" ${file.selected ? 'checked' : ''} onchange="toggleFile(${index})">
						<label for="file-${index}">${file.name} ${errorBadge}</label>
						</div>
						`;
					}).join('');

				updateSelectAllState();
			}

			function toggleFile(index) {
				files[index].selected = !files[index].selected;
				updateSelectAllState();
			}

			function toggleSelectAll() {
				const selectAll = document.getElementById('selectAll').checked;
				files.forEach(file => file.selected = selectAll);
				renderFileList();
			}

			function updateSelectAllState() {
				const selectAllCheckbox = document.getElementById('selectAll');
				const allSelected = files.length > 0 && files.every(file => file.selected);
				const someSelected = files.some(file => file.selected);

				selectAllCheckbox.checked = allSelected;
				selectAllCheckbox.indeterminate = someSelected && !allSelected;
			}

			// NOW ASYNC: Re-fetches selected files to guarantee updated content
			async function generateOutput() {
				const selectedFiles = files.filter(file => file.selected);

				if (selectedFiles.length === 0) {
					alert('Please select at least one file.');
					return;
				}

				const prompt = document.getElementById('promptInput').value.trim();
				if (!prompt) {
					alert('Please enter a prompt.');
					return;
				}

				const generateBtn = document.getElementById('generateBtn');
				const originalBtnText = generateBtn.textContent;

				// Show loading state
				generateBtn.textContent = '⏳ Fetching latest files...';
				generateBtn.disabled = true;

				try {
					// Re-fetch ONLY the selected files to ensure we have the latest content
					for (let i = 0; i < selectedFiles.length; i++) {
						const file = selectedFiles[i];
						try {
							// Add cache-busting timestamp to prevent browser caching
							const response = await fetch(`${file.name}?t=${Date.now()}`);
							if (!response.ok) throw new Error(`Status ${response.status}`);
							const content = await response.text();

							// Update the content in the main files array AND the selectedFiles reference
							const mainFileIndex = files.findIndex(f => f.name === file.name);
							if (mainFileIndex !== -1) {
								files[mainFileIndex].content = content;
								files[mainFileIndex].error = false;
								selectedFiles[i].content = content;
								selectedFiles[i].error = false;
							}
						} catch (error) {
							console.error(`Failed to fetch ${file.name}:`, error);
							const mainFileIndex = files.findIndex(f => f.name === file.name);
							if (mainFileIndex !== -1) {
								files[mainFileIndex].error = true;
								files[mainFileIndex].content = `[Error loading file: ${error.message}]`;
								selectedFiles[i].error = true;
								selectedFiles[i].content = `[Error loading file: ${error.message}]`;
							}
						}
					}

					let output = '';

					// Format each file EXACTLY as requested
					selectedFiles.forEach(file => {
							output += '```' + file.name + '\n';
							output += file.content + '\n';
							output += '```\n\n';
						});

					// Format the prompt
					output += '---\n\n';
					output += '**Prompt:**\n\n';
					output += prompt + '\n';

					// Display output
					document.getElementById('output').textContent = output;
					document.getElementById('outputSection').style.display = 'block';
					document.getElementById('copyBtn').style.display = 'inline-block';
					document.getElementById('clearBtn').style.display = 'inline-block';

				} finally {
					// Restore button state
					generateBtn.textContent = originalBtnText;
					generateBtn.disabled = false;
				}
			}

			function copyOutput() {
				const output = document.getElementById('output').textContent;
				navigator.clipboard.writeText(output).then(() => {
						const btn = document.getElementById('copyBtn');
						const originalText = btn.textContent;
						btn.textContent = '✅ Copied!';
						setTimeout(() => { btn.textContent = originalText; }, 2000);
					}).catch(err => {
						console.error('Failed to copy:', err);
						alert('Failed to copy to clipboard.');
					});
			}

			function clearOutput() {
				document.getElementById('output').textContent = '';
				document.getElementById('outputSection').style.display = 'none';
				document.getElementById('copyBtn').style.display = 'none';
				document.getElementById('clearBtn').style.display = 'none';
			}
		</script>
	</body>
</html>
