<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Three.js RPG - Fixed Controls & Camera</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* --- DEBUG CONSOLE UI --- */
        #debug-toggle {
            position: fixed; top: 10px; left: 10px; z-index: 10000;
            background: rgba(0,0,0,0.8); color: #0f0; border: 1px solid #0f0;
            padding: 8px 12px; font-family: monospace; font-size: 14px;
            border-radius: 4px; pointer-events: auto;
        }
        #debug-console {
            display: none; position: fixed; top: 50px; left: 10px; z-index: 9999;
            width: calc(100% - 20px); max-width: 400px; height: 40vh;
            background: rgba(0, 0, 0, 0.9); border: 1px solid #0f0; border-radius: 4px;
            overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px;
            pointer-events: auto; color: #fff;
        }
        #debug-console .log-msg { color: #fff; margin-bottom: 4px; word-wrap: break-word; white-space: pre-wrap;}
        #debug-console .warn-msg { color: #ffaa00; margin-bottom: 4px; word-wrap: break-word; white-space: pre-wrap;}
        #debug-console .error-msg { color: #ff3333; margin-bottom: 4px; font-weight: bold; word-wrap: break-word; white-space: pre-wrap;}
        #debug-clear {
            position: absolute; top: 5px; right: 5px; background: #333; color: #fff;
            border: none; padding: 2px 6px; font-size: 10px; cursor: pointer;
        }

        /* --- GAME UI OVERLAYS --- */
        .ui-layer { position: fixed; pointer-events: none; color: white; }
        
        #quest-tracker {
            top: 20px; right: 20px; width: 250px;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #d4af37; border-radius: 8px;
            padding: 15px; font-size: 14px;
        }
        #quest-tracker h3 { margin: 0 0 10px 0; color: #d4af37; text-align: center; border-bottom: 1px solid #555; padding-bottom: 5px;}
        .quest-item { margin-bottom: 10px; }
        .quest-title { font-weight: bold; color: #fff; }
        .quest-obj { color: #aaa; font-size: 12px; margin-top: 4px; }
        .quest-obj.completed { color: #4caf50; text-decoration: line-through; }

        #dialogue-box {
            bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; min-height: 100px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #fff; border-radius: 10px;
            padding: 20px; display: none; pointer-events: auto;
        }
        #dialogue-name { color: #d4af37; font-weight: bold; margin-bottom: 10px; font-size: 18px;}
        #dialogue-text { line-height: 1.5; font-size: 16px; min-height: 40px;}
        #dialogue-prompt { text-align: right; font-size: 12px; color: #888; margin-top: 10px; animation: blink 1s infinite;}
        @keyframes blink { 50% { opacity: 0.5; } }

        #interact-prompt {
            bottom: 150px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px;
            font-size: 14px; display: none; border: 1px solid #fff;
        }

        #mobile-controls { display: none; }
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: block; pointer-events: auto; }
            #quest-tracker { width: 180px; font-size: 12px; padding: 10px; top: 50px;}
        }
        
        #joystick-container {
            position: fixed; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; margin-top: -25px; margin-left: -25px;
            background: rgba(255, 255, 255, 0.5); border-radius: 50%;
        }
        #action-btn {
            position: fixed; bottom: 60px; right: 40px;
            width: 80px; height: 80px;
            background: rgba(212, 175, 55, 0.6); border: 2px solid #d4af37;
            border-radius: 50%; color: white; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }
        #action-btn:active { background: rgba(212, 175, 55, 0.9); }
    </style>
</head>
<body>

    <!-- DEBUG CONSOLE -->
    <button id="debug-toggle">Console</button>
    <div id="debug-console">
        <button id="debug-clear">Clear</button>
    </div>

    <!-- GAME UI -->
    <div id="quest-tracker" class="ui-layer">
        <h3>Quest Log</h3>
        <div id="quest-list"></div>
    </div>

    <div id="dialogue-box" class="ui-layer">
        <div id="dialogue-name"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-prompt">Press E / Tap Action to continue</div>
    </div>

    <div id="interact-prompt" class="ui-layer">Press E / Tap Action to Interact</div>

    <div id="mobile-controls">
        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="action-btn">ACTION</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        // ==========================================
        // 0. DEBUG CONSOLE OVERRIDE
        // ==========================================
        const debugConsole = document.getElementById('debug-console');
        const debugToggle = document.getElementById('debug-toggle');
        const debugClear = document.getElementById('debug-clear');

        debugToggle.addEventListener('click', () => {
            debugConsole.style.display = debugConsole.style.display === 'block' ? 'none' : 'block';
        });
        debugClear.addEventListener('click', () => {
            debugConsole.innerHTML = '<button id="debug-clear" onclick="this.parentElement.innerHTML=\'\'">Clear</button>';
        });

        function addDebugMsg(type, args) {
            const msg = document.createElement('div');
            msg.className = `${type}-msg`;
            let text = '';
            try {
                text = Array.from(args).map(arg => {
                    if (typeof arg === 'object') return JSON.stringify(arg, null, 2);
                    return String(arg);
                }).join(' ');
            } catch(e) {
                text = '[Unserializable Object]';
            }
            msg.innerText = `[${type.toUpperCase()}] ${text}`;
            debugConsole.appendChild(msg);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        const origLog = console.log, origWarn = console.warn, origError = console.error;
        console.log = function(...args) { origLog.apply(console, args); addDebugMsg('log', args); };
        console.warn = function(...args) { origWarn.apply(console, args); addDebugMsg('warn', args); };
        console.error = function(...args) { origError.apply(console, args); addDebugMsg('error', args); };

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            addDebugMsg('error', [`CRASH: ${msg} (Line: ${lineNo})`]);
            return false;
        };

        // ==========================================
        // 1. GAME STATE & DATA
        // ==========================================
        const gameState = {
            isDialogueOpen: false,
            currentDialogueQueue: [],
            currentDialogueIndex: 0,
            activeQuests: {},
            inventory: { apples: 0, ores: 0 }
        };

        const quests = {
            mq1: { id: 'mq1', title: 'The Dark Threat', desc: 'Scout the North Castle', status: 'active', type: 'main', objText: 'Reach the North Castle', target: 1, current: 0 },
            sq1: { id: 'sq1', title: 'Hungry Village', desc: 'Help the Farmer', status: 'available', type: 'side', objText: 'Collect Apples (0/3)', target: 3, current: 0 },
            sq2: { id: 'sq2', title: 'Tools of the Trade', desc: 'Help the Blacksmith', status: 'available', type: 'side', objText: 'Collect Iron Ores (0/2)', target: 2, current: 0 }
        };

        const npcDefs = [
            { 
                id: 'elder', name: 'Village Elder', pos: {x: 0, z: 8}, 
                characterConfig: { bodyColor: 0x4a148c, skinColor: 0xffccbc, legColor: 0x4a148c,
                    accessory: (group) => {
                        // Beard faces forward (-Z)
                        const beard = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                        beard.position.set(0, 1.7, -0.3); beard.rotation.x = Math.PI; group.add(beard);
                    }
                },
                dialogue: { start: ["Welcome, hero!", "The Dark Lord has taken the North Castle.", "Please, go there and scout the area!"], active: ["Have you reached the castle yet?"], completed: ["Thank you for your service."] }, quest: 'mq1' 
            },
            { 
                id: 'farmer', name: 'Farmer Joe', pos: {x: -12, z: -5}, 
                characterConfig: { bodyColor: 0x1976d2, skinColor: 0xffccbc, legColor: 0x5d4037,
                    accessory: (group) => {
                        const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xfbc02d }));
                        hat.position.y = 2.4; group.add(hat);
                    }
                },
                dialogue: { start: ["Oh no! My apples are scattered!", "Could you collect 3 for me?"], active: ["Did you find my apples?"], completed: ["Delicious! Thank you!"] }, quest: 'sq1' 
            },
            { 
                id: 'smith', name: 'Blacksmith', pos: {x: 12, z: -5}, 
                characterConfig: { bodyColor: 0x424242, skinColor: 0xffccbc, legColor: 0x212121,
                    accessory: (group) => {
                        // Hammer faces forward/right (-Z, +X)
                        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
                        handle.position.set(0.6, 1.2, -0.2); handle.rotation.z = Math.PI / 4; group.add(handle);
                        const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0x9e9e9e }));
                        head.position.set(0.8, 1.4, -0.2); group.add(head);
                    }
                },
                dialogue: { start: ["I need iron to forge weapons.", "Bring me 2 iron ores."], active: ["Got those ores yet?"], completed: ["Great work."] }, quest: 'sq2' 
            }
        ];

        // ==========================================
        // 2. THREE.JS SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(20, 30, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
        scene.add(sun);

        // ==========================================
        // 3. CHARACTER BUILDER
        // ==========================================
        function createCharacter(config) {
            const group = new THREE.Group();
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.5), new THREE.MeshStandardMaterial({ color: config.bodyColor }));
            body.position.y = 1.2; body.castShadow = true; group.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: config.skinColor }));
            head.position.y = 2.0; head.castShadow = true; group.add(head);

            const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            const armMat = new THREE.MeshStandardMaterial({ color: config.bodyColor });
            const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 1.3, 0); leftArm.castShadow = true; group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 1.3, 0); rightArm.castShadow = true; group.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legMat = new THREE.MeshStandardMaterial({ color: config.legColor });
            const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.4, 0); leftLeg.castShadow = true; group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.4, 0); rightLeg.castShadow = true; group.add(rightLeg);

            group.userData = { leftArm, rightArm, leftLeg, rightLeg };

            if (config.accessory) config.accessory(group);
            return group;
        }

        // ==========================================
        // 4. WORLD BUILDING
        // ==========================================
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x4caf50 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        const wellBase = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1, 16), new THREE.MeshStandardMaterial({ color: 0x757575 }));
        wellBase.position.set(0, 0.5, 0); wellBase.castShadow = true; scene.add(wellBase);
        const wellRoof = new THREE.Mesh(new THREE.ConeGeometry(2, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
        wellRoof.position.set(0, 3, 0); wellRoof.rotation.y = Math.PI / 4; wellRoof.castShadow = true; scene.add(wellRoof);
        for(let i=0; i<4; i++) {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0x4e342e }));
            const angle = (i / 4) * Math.PI * 2;
            pillar.position.set(Math.cos(angle) * 1.2, 1.5, Math.sin(angle) * 1.2);
            scene.add(pillar);
        }

        function createHouse(x, z, color) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshStandardMaterial({ color }));
            base.position.y = 2; base.castShadow = true; base.receiveShadow = true;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 3, 4), new THREE.MeshStandardMaterial({ color: 0xb71c1c }));
            roof.position.y = 5.5; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
            group.add(base, roof); group.position.set(x, 0, z); scene.add(group);
        }
        createHouse(-15, 10, 0xffecb3); createHouse(15, 10, 0xe1f5fe);
        createHouse(-15, -15, 0xfce4ec); createHouse(15, -15, 0xe8f5e9);

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
            trunk.position.y = 1; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), new THREE.MeshStandardMaterial({ color: 0x2e7d32 }));
            leaves.position.y = 3; leaves.castShadow = true;
            group.add(trunk, leaves); group.position.set(x, 0, z); scene.add(group);
        }
        for(let i=0; i<40; i++) {
            let x = (Math.random() - 0.5) * 100; let z = (Math.random() - 0.5) * 100;
            if(Math.abs(x) > 8 || Math.abs(z) > 8) createTree(x, z);
        }

        // North Castle (Forward is -Z, so North is -Z)
        const castleMarker = new THREE.Mesh(new THREE.CylinderGeometry(0, 3, 6, 4), new THREE.MeshStandardMaterial({ color: 0x4a148c, emissive: 0x2a004f }));
        castleMarker.position.set(0, 3, -50); castleMarker.castShadow = true; scene.add(castleMarker);

        // ==========================================
        // 5. ENTITIES
        // ==========================================
        const player = createCharacter({
            bodyColor: 0x1976d2, skinColor: 0xffccbc, legColor: 0x0d47a1,
            accessory: (group) => {
                // Cape is on the BACK (+Z) because the character faces -Z
                const cape = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.1), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
                cape.position.set(0, 1.2, 0.3); group.add(cape);
            }
        });
        player.position.y = 0; 
        scene.add(player);

        const npcs = [];
        npcDefs.forEach(def => {
            const group = createCharacter(def.characterConfig);
            group.position.set(def.pos.x, 0, def.pos.z);
            
            const indicatorGeo = new THREE.OctahedronGeometry(0.3);
            const indicatorMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const indicator = new THREE.Mesh(indicatorGeo, indicatorMat);
            indicator.position.y = 3.2; 
            group.add(indicator);

            scene.add(group);
            npcs.push({ ...def, mesh: group, indicator: indicator, state: 'start' });
        });

        const collectibles = [];
        function spawnCollectible(type, x, z) {
            const color = type === 'apple' ? 0xff0000 : 0x9e9e9e;
            const geo = type === 'apple' ? new THREE.SphereGeometry(0.3) : new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 }));
            mesh.position.set(x, 0.5, z); mesh.castShadow = true; scene.add(mesh);
            collectibles.push({ type, mesh, collected: false });
        }
        spawnCollectible('apple', -18, 2); spawnCollectible('apple', -8, -12); spawnCollectible('apple', 8, 18);
        spawnCollectible('ore', 22, 5); spawnCollectible('ore', 25, -10);

        // ==========================================
        // 6. CONTROLS & INPUT
        // ==========================================
        const keys = {};
        let moveX = 0, moveZ = 0;
        let interactPressed = false;

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'e') interactPressed = true;
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchStartX = 0, touchStartY = 0;

        joystickContainer.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0]; touchStartX = t.clientX; touchStartY = t.clientY;
        });
        joystickContainer.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            let dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / 50; 
            // Fixed Y mapping: Pushing UP (negative dy) should result in negative moveZ (Forward)
            moveZ = dy / 50; 
        });
        joystickContainer.addEventListener('touchend', () => {
            joystickKnob.style.transform = `translate(0px, 0px)`; moveX = 0; moveZ = 0;
        });

        document.getElementById('action-btn').addEventListener('touchstart', e => {
            e.preventDefault(); interactPressed = true;
        });

        // ==========================================
        // 7. QUEST & DIALOGUE LOGIC
        // ==========================================
        const dialogueBox = document.getElementById('dialogue-box');
        const dialogueName = document.getElementById('dialogue-name');
        const dialogueText = document.getElementById('dialogue-text');
        const interactPrompt = document.getElementById('interact-prompt');
        const questList = document.getElementById('quest-list');

        function updateQuestUI() {
            questList.innerHTML = '';
            Object.values(quests).forEach(q => {
                if (q.status === 'available') return;
                const div = document.createElement('div'); div.className = 'quest-item';
                let objClass = q.current >= q.target ? 'quest-obj completed' : 'quest-obj';
                let statusIcon = q.status === 'completed' ? '✅' : (q.type === 'main' ? '⭐' : '📜');
                div.innerHTML = `<div class="quest-title">${statusIcon} ${q.title}</div><div class="${objClass}">${q.objText.replace(/\(\d+\/\d+\)/, `(${q.current}/${q.target})`)}</div>`;
                questList.appendChild(div);
            });
        }

        function openDialogue(npc) {
            gameState.isDialogueOpen = true; dialogueBox.style.display = 'block';
            dialogueName.innerText = npc.name;
            const q = quests[npc.quest];
            let dialogueKey = q.status === 'active' ? 'active' : (q.status === 'completed' ? 'completed' : 'start');
            gameState.currentDialogueQueue = npc.dialogue[dialogueKey];
            gameState.currentDialogueIndex = 0; gameState.currentNPC = npc;
            showDialogueLine();
        }

        function showDialogueLine() {
            if (gameState.currentDialogueIndex < gameState.currentDialogueQueue.length) {
                dialogueText.innerText = gameState.currentDialogueQueue[gameState.currentDialogueIndex];
            } else { closeDialogue(); }
        }

        function advanceDialogue() {
            gameState.currentDialogueIndex++;
            if (gameState.currentDialogueIndex >= gameState.currentDialogueQueue.length) {
                processQuestLogic(gameState.currentNPC); closeDialogue();
            } else { showDialogueLine(); }
        }

        function closeDialogue() { gameState.isDialogueOpen = false; dialogueBox.style.display = 'none'; }

        function processQuestLogic(npc) {
            const q = quests[npc.quest];
            if (q.status === 'available') { q.status = 'active'; npc.state = 'active'; npc.indicator.material.color.setHex(0xffffff); updateQuestUI(); } 
            else if (q.status === 'active' && q.current >= q.target) { q.status = 'completed'; npc.state = 'completed'; npc.indicator.visible = false; updateQuestUI(); }
        }

        function checkCollectibles() {
            collectibles.forEach(item => {
                if (item.collected) return;
                if (player.position.distanceTo(item.mesh.position) < 1.5) {
                    item.collected = true; scene.remove(item.mesh);
                    if (item.type === 'apple' && quests.sq1.status === 'active') { quests.sq1.current++; quests.sq1.objText = `Collect Apples (${quests.sq1.current}/3)`; updateQuestUI(); }
                    if (item.type === 'ore' && quests.sq2.status === 'active') { quests.sq2.current++; quests.sq2.objText = `Collect Iron Ores (${quests.sq2.current}/2)`; updateQuestUI(); }
                }
            });
        }

        function checkMainQuestZone() {
            const q = quests.mq1;
            if (q.status === 'active' && q.current < q.target && player.position.distanceTo(castleMarker.position) < 5) {
                q.current = 1; q.objText = 'Return to the Elder'; updateQuestUI();
            }
        }

        // ==========================================
        // 8. GAME LOOP (FIXED MATH)
        // ==========================================
        const clock = new THREE.Clock();
        const cameraDistance = 14;
        const cameraHeight = 10;
        const targetCamPos = new THREE.Vector3();
        let nearestNPC = null;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // --- INPUT & MOVEMENT ---
            let inputX = 0, inputZ = 0;
            // Standard 3D: Forward is -Z, Backward is +Z
            if (keys['w'] || keys['arrowup']) inputZ -= 1; 
            if (keys['s'] || keys['arrowdown']) inputZ += 1;
            if (keys['a'] || keys['arrowleft']) inputX -= 1;
            if (keys['d'] || keys['arrowright']) inputX += 1;

            inputX += moveX; inputZ += moveZ;
            const len = Math.sqrt(inputX * inputX + inputZ * inputZ);
            if (len > 1) { inputX /= len; inputZ /= len; }

            const isMoving = (Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1);

            if (isMoving && !gameState.isDialogueOpen) {
                // Calculate target rotation. 
                // We invert inputs because Three.js default forward is -Z.
                const targetAngle = Math.atan2(-inputX, -inputZ);
                
                let diff = targetAngle - player.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.rotation.y += diff * 0.15;

                // Move player in the direction they are facing
                const moveSpeed = 6 * delta;
                player.position.x += -Math.sin(player.rotation.y) * moveSpeed;
                player.position.z += -Math.cos(player.rotation.y) * moveSpeed;
            }

            // --- WALK ANIMATION ---
            if (isMoving && !gameState.isDialogueOpen) {
                const swing = Math.sin(clock.elapsedTime * 12) * 0.6;
                player.userData.leftArm.rotation.x = swing;
                player.userData.rightArm.rotation.x = -swing;
                player.userData.leftLeg.rotation.x = -swing;
                player.userData.rightLeg.rotation.x = swing;
            } else {
                player.userData.leftArm.rotation.x *= 0.8;
                player.userData.rightArm.rotation.x *= 0.8;
                player.userData.leftLeg.rotation.x *= 0.8;
                player.userData.rightLeg.rotation.x *= 0.8;
            }

            // --- DYNAMIC CAMERA ---
            // Camera stays behind the player. Since forward is -Z, behind is +Z.
            const camOffsetX = Math.sin(player.rotation.y) * cameraDistance;
            const camOffsetZ = Math.cos(player.rotation.y) * cameraDistance;
            
            targetCamPos.set(
                player.position.x + camOffsetX,
                player.position.y + cameraHeight,
                player.position.z + camOffsetZ
            );
            
            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            // --- INTERACTIONS ---
            nearestNPC = null;
            let nearestDist = 3.5;
            npcs.forEach(npc => {
                const dist = player.position.distanceTo(npc.mesh.position);
                if (dist < nearestDist) { nearestDist = dist; nearestNPC = npc; }
                if(npc.indicator.visible) {
                    npc.indicator.position.y = 3.2 + Math.sin(clock.elapsedTime * 3) * 0.2;
                    npc.indicator.rotation.y += delta * 2;
                }
            });

            interactPrompt.style.display = (nearestNPC && !gameState.isDialogueOpen) ? 'block' : 'none';

            if (interactPressed) {
                interactPressed = false;
                if (gameState.isDialogueOpen) advanceDialogue();
                else if (nearestNPC) openDialogue(nearestNPC);
            }

            // --- WORLD UPDATES ---
            checkCollectibles();
            checkMainQuestZone();
            castleMarker.rotation.y += delta * 0.5;

            renderer.render(scene, camera);
        }

        updateQuestUI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
