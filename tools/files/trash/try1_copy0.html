<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WASM Console</title>

<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background-color: #0d1117;
	color: #c9d1d9;
	font-family: 'Consolas', 'Courier New', monospace;
	font-size: 14px;
	overflow: hidden;
}
#console {
	width: 100%;
	height: 100%;
	padding: 12px;
	box-sizing: border-box;
	overflow-y: auto;
	white-space: pre-wrap;
	word-break: break-all;
}
.log-info { color: #58a6ff; }
.log-warn { color: #d29922; }
.log-error { color: #f85149; }
</style>
</head>
<body>
<div id="console"></div>

<script type="module">
import { WasmRuntime } from '/system/js/wasm-runtime.js';

const consoleEl = document.getElementById('console');

function appendToConsole(msg, type = 'log') {
	const line = document.createElement('div');
	line.className = `log-${type}`;
	const time = new Date().toLocaleTimeString('en-US', { hour12: false });
	const formattedMsg = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
	line.textContent = `[${time}] ${formattedMsg}`;
	consoleEl.appendChild(line);
	consoleEl.scrollTop = consoleEl.scrollHeight;
}

function addToConsole(msg, type = 'log') {
	const line = document.createElement('span');
	line.className = `log-${type}`;
	const formattedMsg = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
	line.textContent = `${formattedMsg}`;
	consoleEl.appendChild(line);
	consoleEl.scrollTop = consoleEl.scrollHeight;
}

// ==========================================
// 1. Intercept native console
// ==========================================
const _origLog = console.log, _origWarn = console.warn, _origError = console.error, _origInfo = console.info;
console.log = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'log'); _origLog.apply(console, args); };
console.info = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'info'); _origInfo.apply(console, args); };
console.warn = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'warn'); _origWarn.apply(console, args); };
console.error = (...args) => { appendToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'error'); _origError.apply(console, args); };




var WasmRegistry = {
	_workers: {},
	_promises: {},
	_peerPromises: {},

	load: function (url, id) {
		if (!this._promises[id]) {
			this._promises[id] = (async () => {
					if (this._workers[id] === undefined) {
						var worker = {};
						const response = await fetch(url);
						if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
						const wasmBuffer = await response.arrayBuffer();
						worker.module = await WebAssembly.compile(wasmBuffer);
						worker.memory = new WebAssembly.Memory({
								initial: 16, maximum: 4096, shared: true
							});
						worker.msgChannel = new MessageChannel();
						this._workers[id] = worker;
					}
					return this._workers[id];
				})();
		}
		return this._promises[id];
	},

	loadWorker: function (url, id, workerScriptUrl = './try1wasm-worker.js') {
		if (!this._promises[id]) {
			this._promises[id] = (async () => {
					if (this._workers[id] === undefined) {
						var workerObj = {};
						const response = await fetch(url);
						if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
						const wasmBuffer = await response.arrayBuffer();
						workerObj.module = await WebAssembly.compile(wasmBuffer);
						workerObj.memory = new WebAssembly.Memory({
								initial: 16, maximum: 4096, shared: true
							});
						workerObj.worker = new Worker(workerScriptUrl, { type: 'module' });

						await new Promise((resolveWorker, rejectWorker) => {
								const initHandler = (e) => {
									if (e.data.type === 'ready') {
										workerObj.worker.removeEventListener('message', initHandler);
										resolveWorker();
									} else if (e.data.type === 'error') {
										workerObj.worker.removeEventListener('message', initHandler);
										rejectWorker(new Error(e.data.payload));
									}
								};
								workerObj.worker.addEventListener('message', initHandler);
								workerObj.worker.onerror = (err) => rejectWorker(new Error(`Worker error: ${err.message}`));

								workerObj.worker.postMessage({
										type: 'init',
										workerId: id,
										wasmModule: workerObj.module,
										sharedMemory: workerObj.memory
									});
							});

						workerObj.worker.onmessage = (e) => {
							const { type, payload, workerId } = e.data;
							if (type === 'stdout') console.log(`[Worker ${workerId}] ${payload}`);
							else if (type === 'stderr') console.error(`[Worker ${workerId}] ${payload}`);
							else console.log(`[Worker ${workerId} Event: ${type}]`, payload);
						};

						workerObj.msgChannel = new MessageChannel();
						this._workers[id] = workerObj;
					}
					return this._workers[id];
				})();
		}
		return this._promises[id];
	},

	waitLoadAll: function () {
		return Promise.all(Object.values(this._promises));
	},

	// ==========================================
	// Peer-to-Peer Mesh Network Setup
	// ==========================================
	setupPeers: function() {
		const ids = Object.keys(this._workers);
		this._peerPromises = {}; // Reset for a fresh mesh setup

		// Create an N x N full mesh network
		for (let i = 0; i < ids.length; i++) {
			for (let j = i + 1; j < ids.length; j++) {
				const idA = ids[i];
				const idB = ids[j];
				const workerA = this._workers[idA];
				const workerB = this._workers[idB];

				const channel = new MessageChannel();

				// A gets port1 and a view of B's shared memory
				this._peerPromises[`${idA}-to-${idB}`] = this._registerPort(workerA, idA, idB, channel.port1, workerB.memory.buffer);

				// B gets port2 and a view of A's shared memory
				this._peerPromises[`${idB}-to-${idA}`] = this._registerPort(workerB, idB, idA, channel.port2, workerA.memory.buffer);
			}
		}
	},

	_registerPort: function(workerObj, selfId, peerId, port, peerMemoryBuffer) {
		return new Promise((resolve, reject) => {
				if (workerObj.worker) {
					// It's a Web Worker
					const handler = (e) => {
						if (e.data.type === 'peerRegistered' && e.data.payload === peerId) {
							workerObj.worker.removeEventListener('message', handler);
							resolve();
						} else if (e.data.type === 'error') {
							workerObj.worker.removeEventListener('message', handler);
							reject(new Error(e.data.payload));
						}
					};
					workerObj.worker.addEventListener('message', handler);

					workerObj.worker.postMessage({
							type: 'registerPeer',
							peerId: peerId,
							port: port,
							peerMemory: peerMemoryBuffer // Pass the SharedArrayBuffer!
						}, [port]); // Transfer the port, but NOT the SharedArrayBuffer
				} else {
					// It's a Main Thread WASM instance
					workerObj.ports = workerObj.ports || {};
					workerObj.peerMemories = workerObj.peerMemories || {};

					workerObj.ports[peerId] = port;
					workerObj.peerMemories[peerId] = new Uint8Array(peerMemoryBuffer);

					port.onmessage = (e) => {
						// Queue or handle incoming messages for main thread WASM
						console.info(`[Main Thread ${selfId}] Received message from peer ${peerId}:`, e.data);
					};
					port.start();
					resolve(); // Main thread is ready immediately
				}
			});
	},

	waitPeerAll: function() {
		return Promise.all(Object.values(this._peerPromises));
	}
};;
//*/




// ==========================================
// 2. WASM Execution (Strictly Single-Threaded)
// ==========================================
async function runWasm() {
	console.info('Fetching try1.wasm...');
	try {

		var g= await WasmRegistry.load('./try1.wasm',0);


		console.info('Initializing WasmRuntime...');
		const runtime = new WasmRuntime({
				memory:g.memory,
				onStdout: (msg) => addToConsole(msg, 'log'),
				onStderr: (msg) => addToConsole(msg, 'error'),
				imports: {
					sys: {
						jstry: (num) => {
							// Synchronous alert from C++
							console.info(`[SYS] jstry called with: ${num}`);
						}
					},
					env: {
						jsCout: (ptr) => {
							const message = runtime.readString(ptr);
							addToConsole(message, 'log');
						}
					}
				}
			});

		console.info('Instantiating WebAssembly module...');
		await runtime.instantiate(g.module);//wasmMod);

		console.info('Executing main()...');
		const exitCode = runtime.run();

		console.info('Calling greet("Alice")...');
		const namePtr = runtime.writeString("Alice");
		const resultPtr = runtime.callExport('greet', namePtr);
		const greeting = runtime.readString(resultPtr);
		console.info(`Result from C++: "${greeting}"`);

		runtime.freeString(namePtr);

		if (exitCode === 0) {
			console.info('🏁 Application finished successfully (Exit Code 0).');
		} else {
			console.warn(`⚠️ Application exited with code: ${exitCode}`);
		}
	} catch (err) {
		_origError('❌ FATAL ERROR:', err);
		const stackTrace = err instanceof Error ? err.stack : String(err);
		appendToConsole(`❌ FATAL ERROR: ${err.message || err}\n\nStack Trace:\n${stackTrace}`, 'error');
	}
}

runWasm();
</script>
</body>
</html>
