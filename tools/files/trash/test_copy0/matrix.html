<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix — Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            color: #00ff41;
        }

        /* Matrix rain canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
        }

        /* Card overlay */
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3), inset 0 0 20px rgba(0, 255, 65, 0.1);
            border-radius: 8px;
            padding: 48px 40px;
            width: 380px;
            backdrop-filter: blur(4px);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 15px #00ff41, 0 0 30px #00ff41;
            color: #00ff41;
            margin-bottom: 4px;
        }

        .logo p {
            font-size: 0.9rem;
            color: #00cc33;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #00ff41;
            margin-bottom: 6px;
            text-shadow: 0 0 5px #00ff41;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ff41;
            border-radius: 4px;
            color: #00ff41;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(0, 255, 65, 0.4);
        }

        .form-group input:focus {
            box-shadow: 0 0 10px #00ff41, inset 0 0 5px rgba(0, 255, 65, 0.2);
            border-color: #00ff41;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
            font-size: 0.8rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00cc33;
            cursor: pointer;
        }

        .remember input {
            accent-color: #00ff41;
        }

        .forgot a {
            color: #00ff41;
            text-decoration: none;
            border-bottom: 1px dashed #00ff41;
        }

        .forgot a:hover {
            text-shadow: 0 0 8px #00ff41;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn-login:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 30px #00ff41;
        }

        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #00cc33;
        }

        .signup-link a {
            color: #00ff41;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-shadow: 0 0 8px #00ff41;
        }

        .error-msg {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff4444;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
            text-shadow: 0 0 5px #ff0000;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="login-card">
        <div class="logo">
            <h1>MATRIX</h1>
            <p>Wake up, Neo...</p>
        </div>

        <div class="error-msg" id="errorMsg">Access denied. Check your credentials.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email / User ID</label>
                <input type="email" id="email" placeholder="you@matrix.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <span class="forgot"><a href="#">Forgot password?</a></span>
            </div>

            <button type="submit" class="btn-login">Enter</button>
        </form>

        <div class="signup-link">
            Not yet unplugged? <a href="#">Join the resistance</a>
        </div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);

        // Resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Simple form validation (demo)
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (email && password) {
                alert('Welcome to the Matrix. (demo — connect your backend)');
                // redirect or do something
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
